aid: green-screens-ai
name: Green Screens AI
description: 'Green Screens AI — now sold as Triumph Intelligence following its acquisition by Triumph Financial
  — publishes predictive freight rate, capacity and pricing intelligence APIs for truckload brokers and shippers
  across the United States and Canada. The estate spans eleven versioned services behind one OAuth2 client-credentials
  gateway: lane rate prediction (spot, network and long-term batch), market intelligence and negotiation advice,
  carrier and lane analytics keyed on SCAC, MC and USDOT identifiers, historical rates, pricing rules, quotes, a
  carrier bid cycle, and a TMS connector for importing loads, carriers and shippers. Twelve first-party OpenAPI
  3.0.2 documents, 36 paths and 47 operations are published openly at connect.greenscreens.ai; the callable production
  host is api.greenscreens.ai. A CDN-distributed browser widget bundle and a Chrome extension are the only client
  libraries.'
