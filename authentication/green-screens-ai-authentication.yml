provisioning:
  self_serve: false
  path: >-
    Credentials are created inside the Triumph Intelligence application: Profile icon > Preferences >
    Credentials. Only Admin users can see the tab. Each credential set has a Client ID (auto-generated),
    a Client Secret (auto-generated, viewable/copyable), a Description, and an enabled/disabled Status.
  provider_guidance: >-
    The provider explicitly recommends one credential set per integration so a single partner can be
    disabled or deleted without revoking the others, and warns that a shared credential set cannot be
    revoked per-partner later.
  rotation: >-
    Credentials can be disabled without deletion, and a new set can be generated at any time. No
    automatic expiry or forced-rotation policy is published.
browser_use:
  supported: conditional
  note: >-
    For browser callers the provider documents a back-end wrapper: your own server calls /v1/auth/token
    with the client credentials and proxies only the access_token to the front end, behind your own
    authentication. A Google id_token path (gauth) also exists but must be enabled per application by
    the provider on request. Your origins must additionally be added to the provider's CORS allowlist.
  source: https://intelligencehelp.triumph.io/en/articles/12461044-acquiring-the-access-token-for-triumph-intelligence-apis
