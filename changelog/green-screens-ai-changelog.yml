entries:
- date: '2026-09'
  breaking: false
  highlights:
  - RFP Manager redesigned; upload flow now starts from a details page.
  - RFP-level editing of general details, pricing configurations and assigned team members.
  - New mappable values and constant values in the bid-file mapping process.
  - >-
    New RFP status labels (Created, Configuring Lanes, Pricing, Ready to Submit, Submitted to Shipper,
    Entering Award, Closed, Archived); existing RFPs remapped automatically.
  - >-
    PC Miler integration for mileage lookups, with Valhalla as a fallback when PC Miler quotas are met.
    This is the upstream behind the 424 distance_calculation_error response.
- date: '2026-08'
  breaking: false
  highlights:
  - LTL carriers excluded from capacity features.
  - Canadian capacity lookup added (small initial carrier subset).
  - Pagination added to bids to manage query time and cost.
  - RFP Manager gains direct lane-detail editing per round, replacing export/re-upload.
  - Fixed a bug that disabled contract thresholds in Pricing Rules.
- date: '2026-07'
  breaking: false
  highlights:
  - Radius filter added to Capacity Intelligence.
  - RFP round lanes viewable in a single view with header filter/sort.
  - Pricing Rules split into contract and spot pages.
  - Fixed a bug breaking the email quote format.
  - New bid status and notifications for email send failure.
- date: '2026-06'
  breaking: false
  highlights:
  - >-
    RFP Manager launched — centralized freight RFP workflow (XLSX/CSV intake, mapping, predictive
    pricing, multi-round up to 3, export in shipper format). Access gated by a Keycloak role.
  - Capacity features now include MC/DOT numbers.
  - '"Request Bid from All" added to Capacity Intelligence.'
- date: '2026-04'
  breaking: false
  highlights:
  - Capacity Intelligence launched.
- date: '2026-03'
  breaking: false
  highlights:
  - Existing quotes became editable on the Quotes tab.
- date: '2026-02'
  breaking: false
  highlights:
  - Lane caps removed for short-term and long-term batch uploads; only a 100 MB file-size limit remains.
  - Batch tab redesigned so results appear in the UI rather than by email only.
- date: '2026-01'
  breaking: false
  highlights:
  - Currency-amount pricing rules can now be calculated as flat rates or per mile.
  - Lane search improved for typos.
  - Flatbed Hotshot rates live, included in Capacity on Tap and Triumph Capacity.
