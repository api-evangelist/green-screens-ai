description: >-
  Green Screens AI (Triumph Intelligence) maintains a dated, month-grouped "What's New" release note
  in its help center, inside an "Updates and Releases" collection. It is a PRODUCT changelog, not an
  API changelog: entries describe application features, and no entry states an API version bump, a
  breaking change, or a deprecation date. API version movement has to be read out of the spec
  info.version fields instead.
