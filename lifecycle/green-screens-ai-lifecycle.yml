    subscribable status surface; a reader should not treat it as per-service API status.
changelog:
  url: https://intelligencehelp.triumph.io/en/articles/8520083-what-s-new
  scope: product
  api_versions_tracked: false
  see: changelog/green-screens-ai-changelog.yml
ownership:
  event: acquisition
  acquirer: Triumph Financial, Inc. (NASDAQ TFIN)
  detail: >-
    Greenscreens.ai was acquired by Triumph Financial and the product is now sold as Triumph
    Intelligence. The API estate is mid-migration and that shows in the lifecycle surface: specs are
    titled "Triumph Intelligence Connect" while served from greenscreens.ai hosts; the Portable Bundle
    global was renamed window.Greenscreens -> window.TriumphIntelligence with the old name kept
    working; info.termsOfService points at triumph.io; and the token endpoint is reachable at both
    api.greenscreens.ai and intelligence.triumph.io. The public marketing host www.greenscreens.ai no
    longer completes a TLS handshake and greenscreens.ai 301s to https://triumph.io/solutions/rates/.
  evidence:
  - url: https://ir.triumph.io/news-events/press-releases/detail/93/triumph-completes-acquisition-of-greenscreens-ai
    status: 200
  - url: https://greenscreens.ai/
    status: 301
    note: redirects to https://triumph.io/solutions/rates/
