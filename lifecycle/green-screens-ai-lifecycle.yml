superseded_but_still_published:
- service: prediction
  version: v2
  spec_version: 2.5.3
  spec: https://connect.greenscreens.ai/prediction/v2/openapi.yaml
  status: available
  sunset_date: null
  note: >-
    The prediction v3 spec description links v2 explicitly ("Older version of this api exists"). v2
    still serves its own OpenAPI (HTTP 200, probed 2026-09-12) and is not marked deprecated:true
    anywhere. No sunset date is published.
- service: quotes
  version: v1
  spec_version: 1.5.0
  spec: https://connect.greenscreens.ai/quotes/v1/openapi.yaml
  status: available
  sunset_date: null
  note: >-
    Quotes v1 carries a LARGER surface than v2 — 6 paths (save/get/accept/reject/update/delete plus
    shipper search and lane-top-quotes) versus 3 in v2 (get/import/batch-import). v2 is not a superset,
    so a caller cannot simply move forward; the two versions serve different jobs and neither is
    documented as replacing the other.
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    No deprecation or sunset policy is published, no RFC 8594 Sunset/Deprecation headers are documented
    on any operation, and no operation in any of the 12 specs carries deprecated: true. What IS marked
    deprecated is field-level only.
  deprecated_operations: []
  deprecated_fields:
  - Bids_BidsSendRequest.carrierEmailList
  - Bids_BidsSendRequest.carrierPhoneList
  - History_LoadRateObject.loadPickupDate
  - MarketIntelligence_NegotiationResponse.holidayIsComing
  - MarketIntelligence_NegotiationResponse.inspectionWeeks
  - MarketIntelligence_NegotiationResponse.originLtrLow
  - MarketIntelligence_NegotiationResponse.destinationLtrHigh
  - TmsConnector_Details.miles
sla:
