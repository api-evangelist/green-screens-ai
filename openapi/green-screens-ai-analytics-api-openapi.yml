        yatCarrierViewUrl:
          type: string
          description: Url to a carrier profile screen in the Yat.ai app
          example: https://portal.yat.ai/carriers/28661
    YatCarrierContacts:
      type: object
      description: Yat.ai carrier contacts info
      properties:
        email:
          type: string
          description: Contact email
          example: test@carrier.com
        phone:
          type: string
          description: Contact phone number
          example: "121331343"
    YatCarrierScore:
      type: object
      description: Yat.ai carrier match score info
      properties:
        normalizedScore:
          type: number
          description: >
            Normalized score, this is the result of combining other scores in
            this object
          example: 99.8374
        sizeScore:
          type: number
          description: |
            Size score
          example: 88.9431
        originScore:
          type: number
          description: |
            Origin score
          example: 97.7236
        destinationScore:
          type: number
          description: |
            Destination score
          example: 79.6748
        relationshipScore:
          type: number
          description: |
            Relationship score
          example: 0
        laneScore:
          type: number
          description: |
            Lane score
          example: 75.2846
    AnalyticsLaneCarrierSourceCarriersResponse:
      type: object
      description: CarrierSource carriers response
      properties:
        carrierSourceCarrierListUrl:
          type: string
          description: Url to a lane search screen in the CarrierSource app
          example: https://carriersource.is/lane-search
        carriers:
          type: array
          description: List of carriers returned by the CarrierSource platform
          maxItems: 20
          items:
            $ref: "#/components/schemas/AnalyticsLaneCarrierSourceCarriersResponseItem"
      required:
        - carrierSourceCarrierListUrl
        - carriers
    AnalyticsLaneCarrierSourceCarriersResponseItem:
      type: object
      description: >
        Carrier data provided by the CarrierSource platform. 

        Only available if the current company is a client of the CarrierSource platform
      properties:
        name:
          type: string
          description: Name of the carrier company
          example: COIN LLC
        dot:
          type: string
          description: Department of Transportation (DOT) number of this carrier
          example: "01467586"
        contacts:
          $ref: "#/components/schemas/CarrierSourceCarrierContacts"
        rating:
          $ref: "#/components/schemas/CarrierSourceCarrierRating"
        carrierSourceCarrierViewUrl:
          type: string
          description: Url to a carrier profile screen in the CarrierSource app
          example: https://www.carriersource.io/carriers/p-h-services-inc
    CarrierSourceCarrierContacts:
      type: object
      description: CarrierSource carrier contacts info
      properties:
        email:
          type: string
          description: Carrier dispatch email
          example: carrier@mail.com
        phone:
          type: string
          description: Carrier dispatch phone number
          example: "121331343"
    CarrierSourceCarrierRating:
      type: object
      description: CarrierSource carrier rating info
      properties:
        starRating:
          type: number
          format: float
          minimum: 0
          maximum: 5
          description: The star rating of this carrier
          example: 4.3
        reviewCount:
          type: integer
          description: The count of reviews used to calculate the star rating
          example: 343
    AnalyticsLaneChaineCarriersResponse:
      type: object
      description: Chaine carriers response
      properties:
        chaineCarrierListUrl:
          type: string
          description: Url to a lane search screen in the Chaine app
          example: https://app.chaine.com/broker/carriers/lane-search
        carriers:
          type: array
          description: List of Chaine carriers matched for this lane
          maxItems: 20
          items:
            $ref: "#/components/schemas/AnalyticsLaneChaineCarriersResponseItem"
      required:
        - carriers
    AnalyticsLaneChaineCarriersResponseItem:
      type: object
      description: >
        Carrier data provided by the Chaine platform. 

        Only available if the current company is a client of the Chaine platform.
      properties:
        name:
          type: string
          description: Carrier company name
          example: Eagle One Delivery
        dot:
          type: string
          description: Department of Transportation (DOT) number of this carrier
          example: USDOT33136
        mc:
          type: string
          description: Motor Carrier (MC) number of this carrier
          example: MC00334234
        contacts:
          $ref: "#/components/schemas/ChaineCarrierContacts"
        numberOfTrips:
          type: integer
          description: |
            The number of trips the carrier has completed
          example: 34
        averageRate:
          type: number
          description: |
            The average rate the matched carrier ran the lane for
          example: 2.1254
        currency:
          type: string
          description: Code of the currency of the response. Format is ISO 4217.
          example: USD
        chaineCarrierViewUrl:
          type: string
          description: Url to a carrier profile screen in the Chaine app
          example: https://app.chaine.com/broker/carriers/28661
      required:
        - currency
    ChaineCarrierContacts:
      type: object
      description: Chaine carrier contacts info
      properties:
        email:
          type: string
          description: Contact email
          example: test@carrier.com
        phone:
          type: string
          description: Contact phone number
          example: "121331343"
    AnalyticsLaneTruckstopCarriersResponse:
      type: object
      description: Truckstop carriers response
      properties:
        truckstopCarrierListUrl:
          type: string
          description: Url to a truck search screen in the Truckstop app
          example: https://app.truckstop.com/Search/Trucks/
        carriers:
          type: array
          description: List of Truckstop carriers matched for this lane
          maxItems: 20
          items:
            $ref: "#/components/schemas/AnalyticsLaneTruckstopCarriersResponseItem"
      required:
        - truckstopCarrierListUrl
        - carriers
    AnalyticsLaneTruckstopCarriersResponseItem:
      type: object
      description: >
        Carrier data provided by the Truckstop platform. 

        Only available if the current company is a client of the Truckstop platform
      properties:
        name:
          type: string
          description: Carrier company name
          example: Eagle One Delivery
        dot:
          type: string
          description: Department of Transportation (DOT) number of this carrier
          example: "01467586"
        mc:
          type: string
          description: Motor Carrier number (MC) of this carrier
          example: "554398"
        truckAvailableDate:
          type: string
          format: date
          description: Date when the truck becomes available
          example: "2024-05-15"
        truckPostedDateTime:
          type: string
          format: date-time
          description: Date when the truck was posted on the loadboard
          example: "2024-01-11T16:00:00Z"
        origin:
          $ref: "#/components/schemas/TruckstopCarrierLocation"
        destination:
          $ref: "#/components/schemas/TruckstopCarrierLocation"
        contacts:
          $ref: "#/components/schemas/TruckstopCarrierContacts"
        truckstopCarrierViewUrl:
          type: string
          description: Url to a truck posting screen in the Truckstop app
          example: https://app.truckstop.com/PostingDetails/Trucks/76427839
    TruckstopCarrierContacts:
      type: object
      description: Truckstop carrier contacts info
      properties:
        email:
          type: string
          description: Contact email
          example: test@carrier.com
        phone:
          type: string
          description: Contact phone number
          example: "121331343"
    TruckstopCarrierLocation:
      type: object
      description: Truckstop truck location info
      properties:
        country:
          type: string
          description: |
            Code of the country where the truck is currently located.

            Two letter country code in ISO 3166-1 alpha-2 format
          example: US
        state:
          type: string
          description: |
            Code of the State where the truck is currently located
          example: TX
        city:
          type: string
          description: |
            Name of the city where the truck is currently located
          example: Dallas
        distance:
          type: number
          description: |
            How far the truck is from the searched area (in miles)
          example: 34
    TransportType:
      type: string
      enum:
        - VAN
        - REEFER
        - FLATBED
        - HOTSHOT
      description: >
        Transport type


        If you would like Hotshot predictions, reach out to your CSM and DA. 

        The model will not work properly without your hotshot data effectively filtered and imported into the model.
      example: VAN
    GeographicalAreaLane:
      type: string
      enum:
        - CITY
        - CITY_ZIP
        - ZIP_CITY
        - ZIP
      description: >
        Determines the size of the area around origin and destination points, 

        that will be searched for the related data.

        * CITY - narrow, city wide, area

        * ZIP - narrow, five digit zip, area

        * CITY_ZIP - a special option that sets origin area to CITY and destination area to ZIP

        * ZIP_CITY - a special option that sets origin area to ZIP and destination area to CITY
      example: ZIP
    AnalyticsLanePerformanceMetricsResponse:
      type: object
      description: Lane Performance Metrics. These include both broker-specific and
        market benchmark metrics
      properties:
        brokerPerformanceMetrics:
          $ref: "#/components/schemas/PerformanceMetricsObject"
        networkPerformanceMetrics:
          $ref: "#/components/schemas/PerformanceMetricsObject"
        networkPerformanceRanks:
          $ref: "#/components/schemas/PerformanceRanksObject"
      required:
        - brokerPerformanceMetrics
        - networkPerformanceMetrics
    PerformanceMetricsObject:
      type: object
      description: Performance metrics
      properties:
        onTimePickup:
          type: number
          description: On Time Pickup %
          minimum: 0
          maximum: 100
          example: 85.24
        onTimeDelivery:
          type: number
          description: On Time Delivery %
          minimum: 0
          maximum: 100
          example: 63.13
        badBounce:
          type: number
          description: Bad Bounce %
          minimum: 0
          maximum: 100
          example: 75.42
        score:
          type: number
          description: T-Score
          example: 98.24
          minimum: 0
          maximum: 100
        leadTimeAverageHours:
          type: number
          description: Booking Lead Time (Avg, in Hrs:Min)
          example: 5
        volume:
          type: number
          description: Volume
          example: 1234
        lastDeliveredDate:
          type: string
          description: Last Delivered At Date
          example: "2026-04-28"
    PerformanceRanksObject:
      type: object
      description: Performance ranks
      properties:
        onTimePickup:
          type: string
          description: On Time Pickup Rank
          example: Top 25%
        onTimeDelivery:
          type: string
          description: On Time Delivery Rank
          example: Bottom 50%
        badBounce:
          type: string
          description: Bad Bounce Rank
          example: Bottom 25%
        leadTimeAverageHours:
          type: string
          description: Booking Lead Time Rank
          example: Top 50%
        volume:
          type: string
          description: Volume Rank
          example: Top 10%
    AnalyticsLaneStrategicCapacityResponse:
      type: object
      description: Analytics lane Strategic Capacity response
      properties:
        items:
          type: array
          description: List of carriers
          maxItems: 10
          items:
            $ref: "#/components/schemas/AnalyticsLaneTriumphCarrierItem"
      required:
        - items
    MarketCode:
      type: string
      description: Machine readable code of a market area
      example: NY_ALB
    ResponseGranularity:
      type: string
      enum:
        - KMA_LANE
        - EXACT_LANE
      description: |
        The granularity level to determine lanes at. 
        KMA_LANE will search and return lanes by their KMA. 
        EXACT_LANE will return lanes by their city/state/zip.
      example: KMA_LANE
    Pagination:
      type: object
      description: Response pagination data
      properties:
        pageNumber:
          type: integer
          description: Current page number (zero-based)
          minimum: 0
          example: 0
        pageSize:
          type: integer
          description: Number of items per page
          minimum: 1
          example: 50
        totalElements:
          type: integer
          format: int64
          description: Total number of items available
          example: 150
        totalPages:
          type: integer
          description: Total number of pages
          example: 3
      required:
        - pageNumber
        - pageSize
