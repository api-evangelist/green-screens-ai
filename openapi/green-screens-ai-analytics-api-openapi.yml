          example: https://cargochief.app/carrier/T2ZmaWNlOjIxMTE0NjIw
    CargoChiefCarrierContacts:
      type: object
      description: Cargo Chief carrier contacts info
      properties:
        name:
          type: string
          description: Contact name
          example: James
        email:
          type: string
