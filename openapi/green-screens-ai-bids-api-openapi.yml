    BidStatus:
      type: string
      enum:
        - SENT
        - RECEIVED
        - FAILED
        - AWARDED
        - ERROR
      description: Bid status
      example: SENT
    BidStatusImport:
      type: string
      enum:
        - SENT
        - RECEIVED
        - AWARDED
      description: Bid status
      example: SENT
    CarrierInfoResponse:
      type: object
      description: Contains a list of carriers
      properties:
        items:
          type: array
          description: List of carriers
          items:
            $ref: "#/components/schemas/CarrierInfoObject"
      required:
        - items
    CarrierInfoObject:
      type: object
      properties:
        companyName:
          type: string
          description: Carrier company name
          example: Carrier Company
        email:
          type: string
          description: Carrier contact email
          example: test@greenscreens.ai
        phoneNumber:
          type: string
          description: Carrier contact phone number
          example: "4112228888"
      required:
        - companyName
    Stops:
      type: array
      description: Stops list
      items:
        $ref: "#/components/schemas/Stop"
      example:
        - order: 0
          address:
            country: US
            city: Red Bluff
            state: CA
            zip: "96080"
            type: ZIP
          type: LOAD
          appointmentDateTime: "2020-10-14T16:00:00Z"
        - order: 1
          address:
            country: US
            city: Redding
            state: CA
            zip: "96002"
            type: CITY
          type: UNLOAD
          appointmentDateTime: "2020-10-15T16:00:00Z"
    Stop:
      type: object
      description: Contains the stop information e.g. address
      properties:
        order:
          type: integer
          description: Stop order, starting from 0
          example: 0
        address:
          $ref: "#/components/schemas/StopAddress"
        type:
          type: string
          description: |
            Action performed with the cargo at this stop
          enum:
            - LOAD
            - UNLOAD
            - BOTH
          example: LOAD
        appointmentDateTime:
          type: string
          format: date-time
          description: |
            Date and time when the truck has to arrive at this stop
          example: "2020-10-13T16:00:00Z"
      required:
        - order
        - address
    StopInput:
      type: object
      description: Contains the stop information e.g. address
      properties:
        order:
          type: integer
          description: Stop order, starting from 0
          example: 0
        address:
          $ref: "#/components/schemas/StopAddressInput"
        type:
          type: string
          description: |
            Action performed with the cargo at this stop.

            Leave this field empty if you do not know the stop type.
          enum:
            - LOAD
            - UNLOAD
            - BOTH
          example: LOAD
        appointmentDateTime:
          type: string
          format: date-time
          description: |
            Date and time when the truck has to arrive at this stop.

            Provide the time zone of the stop location if possible.
          example: "2020-10-13T16:00:00Z"
      required:
        - order
        - address
    StopAddress:
      type: object
      description: Location specified by country, city, state and zip code
      properties:
        country:
          type: string
          description: Two letter country code in ISO 3166-1 alpha-2 format
          example: US
        state:
          type: string
          description: State
          example: NY
        city:
          type: string
          description: City
          example: Schenectady
        zip:
          type: string
          description: Zip
          example: "12345"
        type:
          type: string
          enum:
            - CITY
            - ZIP
          example: ZIP
          description: Type of address
      required:
        - country
        - state
        - city
        - zip
        - type
    StopAddressInput:
      type: object
      description: >
        Location specified by country, city, state and zip code.

        * Country is required

        * Either city-state pair or zip code is required

        * All four parameters can be passed together


        (in case of city-state pair our platform will determine the zip code

        and in case of a zip code, our platform will determine the city and the state)
      properties:
        country:
          type: string
          description: Two letter country code in ISO 3166-1 alpha-2 format
          example: US
        state:
          type: string
          description: State
          example: NY
        city:
          type: string
          description: City
          example: Schenectady
        zip:
          type: string
          description: Zip
          example: "12345"
      required:
        - country
    Carrier:
      type: object
      description: Imported bid carrier information
      properties:
        id:
          type: string
          description: Customer TMS ID of the carrier profile associated with this bid
          example: "64378901"
        name:
          type: string
          description: Carrier company name
          example: CarrierCompany
        mc:
          type: string
          description: Carrier MC number
          example: "888015"
        dot:
          type: string
          description: Carrier DOT number
          example: "87650005"
        email:
          type: string
          description: Carrier contact email
          example: carrier@mail.com
        phone:
          type: string
          description: Carrier contact phone number
          example: "4112228888"
      required:
        - name
    RecentBidsResponse:
      type: object
      description: Contains an array of bids
      properties:
        items:
          type: array
          description: bids
          items:
            $ref: "#/components/schemas/BidObject"
    BidByKeyResponse:
      type: object
      allOf:
        - $ref: "#/components/schemas/BidObject"
      properties:
        distance:
          type: number
          description: Total distance of the trip (in miles)
          example: 289
      required:
        - distance
    BidsResponseMessage:
      allOf:
        - $ref: "#/components/schemas/ResponseMessage"
        - type: object
          properties:
            serviceResponse:
              type: string
              x-enum-varnames:
                - no_bid_recipients
                - bid_expired
              enum:
                - No bid recipients, email or phone, provided
                - Bid has expired due to past pickup date
    BidsImportRequest:
      type: object
      description: A body of the request to import a bid
      properties:
        bidId:
          type: string
          description: |
            Unique bid id from the customers system. 

            If a bid with the same bidId will be found in our platform, 
            it will be updated. Otherwise a new bid will be created
          example: Q#54321
        loadId:
          type: string
          description: Associated load id (pro number)
          example: Pro#111111
        userEmail:
          type: string
          description: Email of the user who will be the owner/creator of the bid
          example: buddy@greenscreens.ai
        transportType:
          type: string
          description: Transport type (original transport type used in provider TMS)
          example: VR
        transportTypeGroup:
          $ref: "#/components/schemas/TransportTypeGroup"
        stops:
          type: array
          items:
            $ref: "#/components/schemas/StopInput"
        pickupDateTime:
          type: string
          format: date-time
          description: >
            Pick up date with time in time zone of the pick up location.


            The time zone you provide will be ignored, 

            so you have to make sure that the day and the hours are exactly 

            those that you want to store in our system. 


            e.g. if the load has to be delivered at 16:00 in the time zone

            of the drop off point, you have to send us 16:00 in this string.


            e.g. if you send 2020-10-13T16:00:00Z in utc, our system will

            cut off the UTC time zone, and attach the time zone of the pick up point,

            but the date and time will still stay 2020-10-13T16:00:00.
          example: "2020-10-13T16:00:00Z"
        deliveredDateTime:
          type: string
          format: date-time
          description: >
            Delivered date with time in time zone of drop off location.


            The time zone you provide will be ignored, 

            so you have to make sure that the day and the hours are exactly 

            those that you want to store in our system. 


            e.g. if the load has to be delivered at 16:00 in the time zone

            of the drop off point, you have to send us 16:00 in this string.


            e.g. if you send 2020-10-13T16:00:00Z in utc, our system will

            cut off the UTC time zone, and attach the time zone of the pick up point,

            but the date and time will still stay 2020-10-13T16:00:00
          example: "2020-10-13T16:00:00Z"
        bidDateTime:
          type: string
          format: date-time
          description: The date and time when the bid was created
          example: "2020-10-11T16:00:00Z"
        status:
          $ref: "#/components/schemas/BidStatusImport"
        weight:
          type: number
          format: float
          description: Total cargo weight in lb
          example: 20000
        commodity:
          type: string
          description: Commodity description in free form
          example: Steel racks
        brokerComment:
          type: string
          description: Comment from broker to carrier
          example: Something a broker would comment
        carrierComment:
          type: string
          description: Comment from carrier
          example: Looks good
        carrier:
          $ref: "#/components/schemas/Carrier"
        bidCost:
          type: number
          description: Bid cost (flat)
          example: 1000.5
        currency:
          $ref: "#/components/schemas/Currency"
      required:
        - bidId
        - userEmail
        - transportType
        - transportTypeGroup
        - stops
        - pickupDateTime
        - status
        - bidCost
        - carrier
        - currency
    BidsBatchImportResponse:
      type: object
      properties:
        responses:
          type: array
          description: List of bid import responses
          items:
            $ref: "#/components/schemas/BidsBatchImportResponseItem"
      required:
        - responses
    BidsBatchImportResponseItem:
      type: object
      description: |
        Response for this particular bid import attempt
      properties:
        bidId:
          type: string
          description: Unique bid id from the customers system
          example: Q#54321
        status:
          type: string
          enum:
            - CREATED
            - UPDATED
            - ERROR
          description: |
            Bid import status. 
            * CREATED - a new bid was created
            * UPDATED - an existing bid was updated
            * ERROR - an error occurred during bid import
          example: CREATED
        error:
          type: object
          description: >
            Import attempt error data. Available when the import attempt was
            unsuccessful and the status is ERROR
          properties:
            code:
              type: string
              description: Unique string identifier of the error
              example: validation_errors_occurred
            message:
              type: string
              description: Human readable error message
              example: Validation errors occurred, check errors array for details
            errors:
              type: array
              description: A list of validation errors that occurred during the import
                attempt.
              items:
                $ref: "#/components/schemas/RequestValidationError"
          required:
            - code
            - message
            - errors
      required:
        - bidId
        - status
    BidsOtherCompanyBatchImportRequest:
      type: object
      properties:
        companyId:
          type: string
          description: |
            Id of the company that you want the bids to be imported for
          example: 6F9619FF-8B86-D011-B42D-00CF4FC964FF
        bids:
          type: array
          description: List of bids to import
          items:
            $ref: "#/components/schemas/BidsImportRequest"
          maxItems: 1000
      required:
        - companyId
        - bids
    Address:
      type: object
      description: Location specified by country, city, state and zip code
      properties:
        country:
          type: string
          description: Two letter country code in ISO 3166-1 alpha-2 format
          example: US
        state:
          type: string
          description: state
          example: NY
        city:
          type: string
          description: city
          example: Schenectady
        zip:
          type: string
          description: zip
          example: "12345"
        type:
          type: string
          enum:
            - CITY
            - ZIP
          example: ZIP
          description: Type of address
      required:
        - city
        - state
        - zip
        - type
    TransportType:
      type: string
      enum:
        - VAN
        - REEFER
        - FLATBED
        - HOTSHOT
      description: >
        Transport type


        If you would like Hotshot predictions, reach out to your CSM and DA. 

        The model will not work properly without your hotshot data effectively filtered and imported into the model.
      example: VAN
    TransportTypeGroup:
      type: string
      description: Transport type group
      enum:
        - VAN
        - REEFER
        - FLATBED
        - HOTSHOT
        - OTHER
      example: VAN
    Currency:
      type: string
      enum:
        - USD
        - CAD
      description: |
        Currency code in ISO 4217 format (three letter code, e.g. USD)

        _If not provided, defaults to the currency set in the profile 
        of currently authenticated user (or currently authenticated company 
        if there is no user or user profile setting)_
      example: USD
    Error:
      type: object
      description: A common api error object
      properties:
        code:
          type: string
          description: unique string identifier of the error
        message:
          type: string
          description: human readable error message
      required:
        - code
        - message
      example:
        code: invalid_request
        message: Your ClientId is invalid
    ResponseMessage:
      type: object
      properties:
        commonResponse:
          type: string
          x-enum-varnames:
            - not_readable_message
            - access_forbidden
            - item_not_found
            - request_timeout
            - request_validation
            - parse_error
            - internal_error
            - access_forbidden_companyId
            - method_not_allowed
            - missing_required_parameter
          enum:
            - "Body request is not readable : %s"
            - Access is forbidden
            - Item not found
            - Request timeout after {} sec
            - You have one or more errors in request structure
            - "Text '%s' could not be parsed in field: %s"
            - Internal server error
            - companyId in JWT token is not equals importCompanyId in request
              body
            - Method not allowed
            - Missing required parameter
        serviceResponse:
          type: string
    RequestValidationError:
      type: object
      description: Request validation error
      properties:
        field:
          type: string
          description: Name of the field that did not pass validation
          example: transportType
        message:
          type: string
          description: Human readable error mesage explaining why validation failed
          example: SpaceXDragon transportType is not supported. Valid values are [VAN,
            FLATBED, ...]
        value:
          type: string
          nullable: true
          description: Value of the field that did not pass validation
          example: SpaceXDragon
      required:
        - field
        - message
