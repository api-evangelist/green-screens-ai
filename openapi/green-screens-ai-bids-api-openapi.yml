openapi: 3.0.2
info:
  title: Bids
  version: 1.3.2
  description: Carrier bids service v1
  x-logo:
    url: https://static.greenscreens.ai/main-logo.svg
    backgroundColor: "#fafafa"
    altText: Triumph Intelligence
  termsOfService: https://triumph.io/terms-of-service/
  contact:
    name: API Support
    email: support@greenscreens.ai
    url: https://connect.intelligence.triumph.io
tags:
  - name: Bids
    description: Endpoints to save, get and update bids
paths:
  /bids:
    post:
      tags:
        - Bids
      summary: Save bid
      description: Save bid
      security:
        - bearerAuth: []
      operationId: saveBid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidsRequest"
        required: true
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidResponse"
        "400":
          $ref: "#/paths/~1bids/get/responses/400"
        "401":
          $ref: "#/paths/~1bids/get/responses/401"
        "403":
          $ref: "#/paths/~1bids/get/responses/403"
        "422":
          $ref: "#/paths/~1bids/get/responses/422"
        "429":
          $ref: "#/paths/~1bids/get/responses/429"
        "500":
          $ref: "#/paths/~1bids/get/responses/500"
    get:
      tags:
        - Bids
      summary: Get current user bids
      description: Get current user bids
      security:
        - bearerAuth: []
      operationId: getBids
      parameters:
        - in: query
          name: createdDateFrom
          description: bid created date >= value
          required: true
          schema:
            type: string
            format: date
            example: "2019-09-30"
        - in: query
          name: createdDateTo
          description: bid created date <= value
          schema:
            type: string
            format: date
            example: "2019-12-30"
        - in: query
          name: currency
          schema:
            $ref: "#/components/schemas/Currency"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidsResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                error400Example:
                  value:
                    code: missing_required_parameter
                    message: Your request was missing a {par_name} parameter
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                error403Example:
                  value:
                    code: access_forbidden
                    message: Access is forbidden
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                error404Example:
                  value:
                    code: item_not_found
                    message: Item not found
        "422":
          description: Unprocessable Entity with multiple errors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  errors:
                    type: array
                    description: list of errors
                    items:
                      $ref: "#/components/schemas/RequestValidationError"
                required:
                  - code
                  - message
                  - errors
                example:
                  code: request_validation
                  message: You have one or more errors in request structure
                  errors:
                    - field: carrierName
                      message: field contains wrong data type (int), should be string
                      value: "22"
                    - field: shipperId
                      message: "shipperId: must not be null"
                      value: null
                    - field: loadSource.loadId
                      message: "loadId: must not be null"
                      value: null
              examples:
                error422MultiExample:
                  value:
                    code: request_validation
                    message: You have one or more errors in request structure
                    errors:
                      - field: carrierName
                        message: field contains wrong data type (int), should be string
                        value: "22"
                      - field: shipperId
                        message: "shipperId: must not be null"
                        value: null
                      - field: loadSource.loadId
                        message: "loadId: must not be null"
                        value: null
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                error429TooManyRequests:
                  value:
                    code: too_many_requests
                    message: Request limit exceeded
        "500":
          description: Unhandled server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                error500Example:
                  value:
                    code: internal_error
                    message: Internal server error
  "/bids/{bidId}":
    patch:
      tags:
        - Bids
      summary: Update bid
      description: Update bid
      security:
        - bearerAuth: []
      operationId: updateBid
      parameters:
        - in: path
          name: bidId
          description: Id of the bid that you want updated
          required: true
          schema:
            type: integer
            format: int64
            example: 12345
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidsUpdateRequest"
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidObject"
        "400":
          $ref: "#/paths/~1bids/get/responses/400"
        "401":
          $ref: "#/paths/~1bids/get/responses/401"
        "403":
          $ref: "#/paths/~1bids/get/responses/403"
        "404":
          $ref: "#/paths/~1bids/get/responses/404"
        "422":
          $ref: "#/paths/~1bids/get/responses/422"
        "429":
          $ref: "#/paths/~1bids/get/responses/429"
        "500":
          $ref: "#/paths/~1bids/get/responses/500"
    delete:
      tags:
        - Bids
      summary: Delete bid
      description: Delete bid
      security:
        - bearerAuth: []
      operationId: deleteBid
      parameters:
        - in: path
          name: bidId
          description: Id of the bid that you want deleted
          required: true
          schema:
            type: integer
            format: int64
            example: 12345
      responses:
        "204":
          description: Success
        "400":
          $ref: "#/paths/~1bids/get/responses/400"
        "401":
          $ref: "#/paths/~1bids/get/responses/401"
        "403":
          $ref: "#/paths/~1bids/get/responses/403"
        "404":
          $ref: "#/paths/~1bids/get/responses/404"
        "429":
          $ref: "#/paths/~1bids/get/responses/429"
        "500":
          $ref: "#/paths/~1bids/get/responses/500"
  /bids/carriers:
    get:
      tags:
        - Bids
      summary: Search carriers
      description: Search carriers
      security:
        - bearerAuth: []
      operationId: carrierInfo
      parameters:
        - in: query
          name: query
          description: >
            Query string. Names are first checked using case insensitive
            startsWith  and then case insensitive contains.
          schema:
            type: string
            example: Joe
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarrierInfoResponse"
        "400":
          $ref: "#/paths/~1bids/get/responses/400"
        "401":
          $ref: "#/paths/~1bids/get/responses/401"
        "403":
          $ref: "#/paths/~1bids/get/responses/403"
        "404":
          $ref: "#/paths/~1bids/get/responses/404"
        "422":
          $ref: "#/paths/~1bids/get/responses/422"
        "429":
          $ref: "#/paths/~1bids/get/responses/429"
        "500":
          $ref: "#/paths/~1bids/get/responses/500"
  /bids/accept:
    post:
      tags:
        - Bids
      summary: Accept bid
      description: Accept bid
      operationId: acceptBid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidActionRequest"
        required: true
      responses:
        "204":
          description: Success
        "400":
          $ref: "#/paths/~1bids/get/responses/400"
        "401":
          $ref: "#/paths/~1bids/get/responses/401"
        "403":
          $ref: "#/paths/~1bids/get/responses/403"
        "404":
          $ref: "#/paths/~1bids/get/responses/404"
        "422":
          $ref: "#/paths/~1bids/get/responses/422"
        "429":
          $ref: "#/paths/~1bids/get/responses/429"
        "500":
          $ref: "#/paths/~1bids/get/responses/500"
  /bids/send:
    post:
      tags:
        - Bids
      summary: Send bid request
      description: Send bid request to a carrier
      security:
        - bearerAuth: []
      operationId: requestBid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidsSendRequest"
        required: true
      responses:
        "204":
          description: Success
        "400":
          $ref: "#/paths/~1bids/get/responses/400"
        "401":
          $ref: "#/paths/~1bids/get/responses/401"
        "403":
          $ref: "#/paths/~1bids/get/responses/403"
        "404":
          $ref: "#/paths/~1bids/get/responses/404"
        "422":
          $ref: "#/paths/~1bids/get/responses/422"
        "429":
          $ref: "#/paths/~1bids/get/responses/429"
        "500":
          $ref: "#/paths/~1bids/get/responses/500"
  /bids/recent:
    get:
      tags:
        - Bids
      summary: Get ten most recent bids for a lane
      description: Get ten most recent bids for a lane
      operationId: recentBids
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: transportType
          schema:
            type: string
            enum:
              - VAN
              - REEFER
              - FLATBED
              - HOTSHOT
            description: Transport type
            example: VAN
          required: true
        - in: query
          name: originCountry
          schema:
            type: string
            example: US
          description: |
            Origin country. 
            Two letter country code in ISO 3166-1 alpha-2 format
        - in: query
          name: originState
          schema:
            type: string
            description: Origin state
            example: NY
        - in: query
          name: originCity
          schema:
            type: string
            description: Origin city
            example: Schenectady
        - in: query
          name: originZip
          schema:
            type: string
            example: "12345"
            description: Origin area zip
          required: true
        - in: query
          name: destinationCountry
          schema:
            type: string
            example: US
          description: |
            Destination country. 
            Two letter country code in ISO 3166-1 alpha-2 format
        - in: query
          name: destinationState
          schema:
            type: string
            description: Destination state
            example: IL
        - in: query
          name: destinationCity
          schema:
            type: string
            description: Destination city
            example: Chicago
        - in: query
          name: destinationZip
          schema:
            type: string
            example: "60636"
            description: Destination area zip
          required: true
        - in: query
          name: hasExtraStops
          schema:
            type: boolean
            example: true
            description: |
              Signifies whether the requested lane has extra stops or not.

              If true, multistop loads will be included during calculations.
            default: false
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
            example: "2019-09-30"
            description: Date range for bids created from
          required: true
        - in: query
          name: region
          schema:
            type: string
            enum:
              - CITY
              - CITY_ZIP
              - ZIP_CITY
              - ZIP
              - 3DZIP
              - KMA
            description: >
              Determines the size of the area around the origin and destination
              points, 

              that will be searched for the related data.

              * CITY - narrow, city wide, area

              * ZIP - narrow, five digit zip, area

              * 3DZIP - medium, short zip, area

              * KMA - big, market wide, area

              * CITY_ZIP - a special option that sets origin area to CITY and destination area to ZIP

              * ZIP_CITY - a special option that sets origin area to ZIP and destination area to CITY
            example: ZIP
          required: true
        - in: query
          name: currency
          schema:
            $ref: "#/components/schemas/Currency"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentBidsResponse"
        "400":
          $ref: "#/paths/~1bids/get/responses/400"
        "401":
          $ref: "#/paths/~1bids/get/responses/401"
        "403":
          $ref: "#/paths/~1bids/get/responses/403"
        "404":
          $ref: "#/paths/~1bids/get/responses/404"
        "422":
          $ref: "#/paths/~1bids/get/responses/422"
        "429":
          $ref: "#/paths/~1bids/get/responses/429"
        "500":
          $ref: "#/paths/~1bids/get/responses/500"
  "/bids/by-key/{key}":
    get:
      tags:
        - Bids
      summary: Get bid information by key
      description: Get bid information by key
      operationId: getBidByKey
      parameters:
        - in: path
          name: key
          description: Key of the requested bid
          required: true
          schema:
            type: string
            example: 69bb0a85-f0d0-4d40-abb5-b0e6d82cd234
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidByKeyResponse"
        "400":
          $ref: "#/paths/~1bids/get/responses/400"
        "401":
          $ref: "#/paths/~1bids/get/responses/401"
        "403":
          $ref: "#/paths/~1bids/get/responses/403"
        "404":
          $ref: "#/paths/~1bids/get/responses/404"
        "422":
          $ref: "#/paths/~1bids/get/responses/422"
        "429":
          $ref: "#/paths/~1bids/get/responses/429"
        "500":
          $ref: "#/paths/~1bids/get/responses/500"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    BidActionRequest:
      type: object
      description: Carries data necessary for accepting a bid
      properties:
        key:
          type: string
          description: Key of the bid which you want to accept
          example: c5d1cfa8-228b-11eb-adc1-0242ac120002
        bidCost:
          type: number
          description: Bid rate from user
          example: 1000.5
        carrierName:
          type: string
          description: Carrier company name
          example: Carrierr Transportation
        carrierMC:
          type: string
          description: Carrier MC number
          example: "888015"
        carrierComment:
          type: string
          description: Comment for broker
          example: Looks good
        currency:
          $ref: "#/components/schemas/Currency"
      required:
        - key
        - bidCost
        - carrierName
    BidsSendRequest:
      type: object
      properties:
        userEmail:
          type: string
          description: Email of the user who will be the owner/creator of the bid
          example: buddy@greenscreens.ai
        carriers:
          type: array
          description: |
            List of carriers to whom the bid request should be sent to
          items:
            $ref: "#/components/schemas/BidsSendRequestCarrier"
        carrierEmailList:
          type: array
          items:
            type: string
            nullable: true
          deprecated: true
          minItems: 0
          maxItems: 500
          description: |
            List of emails that the bid request should be sent to

            __Deprecated: use `carriers` field instead__
          example:
            - carrier1@mail.com
            - carrier2@mail.com
            - carrier3@mail.com
        carrierPhoneList:
          type: array
          items:
            type: string
            nullable: true
          deprecated: true
          minItems: 0
          maxItems: 500
          description: >
            List of phone numbers that the bid request should be sent to as a
            message.


            __This feature only works if you have 'TextLocate' integration enabled for your company.__


            _Valid phone number is a string with ten digits in it._


            __Deprecated: use `carriers` field instead__
          example:
            - "8456951387"
            - "7456951583"
            - "2458951391"
        origin:
          $ref: "#/components/schemas/Address"
        destination:
          $ref: "#/components/schemas/Address"
        extraStops:
          type: array
          items:
            $ref: "#/components/schemas/StopInput"
        pickupDateTime:
          type: string
          format: date-time
          description: >
            Pick up date with time in time zone of the pick up location.


            The time zone you provide will be ignored, 

            so you have to make sure that the day and the hours are exactly 

            those that you want to store in our system. 


            e.g. if the load has to be delivered at 16:00 in the time zone

            of the drop off point, you have to send us 16:00 in this string.


            e.g. if you send 2020-10-13T16:00:00Z in utc, our system will

            cut off the UTC time zone, and attach the time zone of the pick up point,

            but the date and time will still stay 2020-10-13T16:00:00.
          example: "2020-10-13T16:00:00Z"
        deliveredDateTime:
          type: string
          format: date-time
          description: >
            Delivered date with time in time zone of drop off location.


            The time zone you provide will be ignored, 

            so you have to make sure that the day and the hours are exactly 

            those that you want to store in our system. 


            e.g. if the load has to be delivered at 16:00 in the time zone

            of the drop off point, you have to send us 16:00 in this string.


            e.g. if you send 2020-10-13T16:00:00Z in utc, our system will

            cut off the UTC time zone, and attach the time zone of the pick up point,

            but the date and time will still stay 2020-10-13T16:00:00
          example: "2020-10-13T16:00:00Z"
        loadProNumber:
          type: string
          description: Internal load pro number
          example: Pro#111111
        weight:
          type: number
          format: float
          description: Total cargo weight in lb
          example: 20000
        commodity:
          type: string
          description: commodity description in free form
          example: Steel racks
        brokerComment:
          type: string
          description: Comment for carrier
          example: Please, be carefully with my load
        transportType:
          $ref: "#/components/schemas/TransportType"
      required:
        - carrierName
        - origin
        - destination
        - transportType
    BidsSendRequestCarrier:
      type: object
      description: |
        Describes a carrier 
        and how a bid request to that carrier should be made
      properties:
        carrierInfo:
          $ref: "#/components/schemas/BidsSendRequestCarrierCarrierInfo"
        carrierInfoSource:
          type: string
          description: The source of the carrier info
          enum:
            - MANUAL_ENTRY
            - CLIENT_DATA_CARRIER_SEARCH
            - CLIENT_DATA_BIDS
            - CLIENT_DATA_TOP_CARRIERS
            - STRATEGIC_CAPACITY
            - HIGHWAY
            - CARGO_CHIEF
            - YAT
            - TRUCKSTOP
            - CARRIER_SOURCE
            - CHAINE
            - OTHER
          example: HIGHWAY
        sendRequestTo:
          type: array
          uniqueItems: true
          minItems: 1
          description: >
            List of channels that bid requests should be sent through.


            * CARRIER_INFO_PHONE - a bid request will be sent to

            the phone number provided in the `carrierInfo.phone` field. 

            __This only works if you have SMS bids functionality enabled for your company__

            * CARRIER_INFO_EMAIL - a bid request will be sent to

            the email address provided in the `carrierInfo.email` field


            If several values are provided then several bid requests will be

            created and sent through appropriate channels
          items:
            type: string
            description: The channel that the bid request can be sent through
            enum:
              - CARRIER_INFO_EMAIL
              - CARRIER_INFO_PHONE
            example: CARRIER_INFO_EMAIL
      required:
        - sendRequestTo
    BidsSendRequestCarrierCarrierInfo:
      type: object
      description: Describes the carrier to whom the bid request is sent
      properties:
        name:
          type: string
          description: Carrier company name
          example: CarrierCompany
        mc:
          type: string
          description: Carrier MC number
          example: "888015"
        dot:
          type: string
          description: Carrier DOT number
          example: "87650005"
        phone:
          type: string
          description: Carrier contact phone number
          example: "4112228888"
        email:
          type: string
          description: Carrier contact email address
          example: carrier@mail.com
    BidObject:
      type: object
      x-parent: true
      properties:
        id:
          type: integer
          format: int64
          description: id of the bid
          example: 23456
        userEmail:
          type: string
          description: Email of the owner of the bid
          example: buddy@greenscreens.ai
        pickupDateTime:
          type: string
          format: date-time
          description: Related load pickup date
          example: "2020-09-14T16:00:00Z"
        deliveredDateTime:
          type: string
          format: date-time
          description: Related load delivery date
          example: "2020-09-14T16:00:00Z"
        createdDate:
          type: string
          format: date-time
          description: Bid creation date
          example: "2020-09-14T16:00:00Z"
        bidStatus:
          $ref: "#/components/schemas/BidStatus"
        errorReason:
          type: string
          description: Human-readable reason the bid is in an ERROR state, if any
          example: Failed to deliver email to carrier
        bidCost:
          type: number
          description: Bid rate
          example: 1000.5
        wasViewed:
          type: boolean
          description: States whether the bid was viewed by the broker after being
            accepted by carrier
          example: false
        carrierName:
          type: string
          description: Carrier company name
          example: Carrierr Transportation
        carrierMC:
          type: string
          description: Carrier MC number
          example: "888015"
        carrierPhone:
          type: string
          description: Carrier contact phone number
          example: "4112228888"
        carrierEmail:
          type: string
          description: Carrier contact email
          example: test@greenscreens.ai
        transportType:
          $ref: "#/components/schemas/TransportType"
        origin:
          $ref: "#/components/schemas/Address"
        destination:
          $ref: "#/components/schemas/Address"
        extraStops:
          $ref: "#/components/schemas/Stops"
        loadProNumber:
          type: string
          description: Internal load pro number
        weight:
          description: Total cargo weight in lb
          type: number
          format: float
          example: 20000
        commodity:
          type: string
          description: Commodity description in free form
          example: Very important load
        brokerComment:
          type: string
          description: Comment for carrier
          example: Please, be carefully with my load
        carrierComment:
          type: string
          description: Comment for broker
          example: Looks good
        currency:
          type: string
          description: Code of the currency of the response. Format is ISO 4217.
          example: USD
      required:
        - userEmail
        - bidStatus
        - pickupDate
        - deliveredDate
        - bidCost
        - carrierName
        - carrierEmail
        - transportType
        - origin
        - destination
        - extraStops
        - wasViewed
        - currency
    BidResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Bid ID in the platform
          example: 12345
        key:
          type: string
          description: Unique key used to create a link to the bid in the platform
          example: deedc41f-7eb2-4c36-9d35-fb6958a43771
      required:
        - id
        - key
    BidsResponse:
      type: object
      description: Object containing an array of bids
      properties:
        items:
          type: array
          description: Array of bids
          items:
            $ref: "#/components/schemas/BidObject"
      required:
        - items
    BidsRequest:
      type: object
      properties:
        userEmail:
          type: string
          description: Email of the user who will be the owner/creator of the bid
          example: buddy@greenscreens.ai
        carrierName:
          type: string
          description: Carrier company name
          example: CarrierCompany
        carrierMC:
          type: string
          description: Carrier MC number
          example: "888015"
        carrierDOT:
          type: string
          description: Carrier DOT number
          example: "87650005"
        carrierEmail:
          type: string
          nullable: true
          description: User email
          example: carrier@mail.com
        carrierPhone:
          type: string
          nullable: true
          description: Carrier contact phone number
          example: "4112228888"
        origin:
          $ref: "#/components/schemas/Address"
        destination:
          $ref: "#/components/schemas/Address"
        extraStops:
          type: array
          items:
            $ref: "#/components/schemas/StopInput"
        transportType:
          $ref: "#/components/schemas/TransportType"
        pickupDateTime:
          type: string
          format: date-time
          nullable: true
          description: >
            Pick up date with time in time zone of the pick up location.


            The time zone you provide will be ignored, 

            so you have to make sure that the day and the hours are exactly 

            those that you want to store in our system. 


            e.g. if the load has to be delivered at 16:00 in the time zone

            of the drop off point, you have to send us 16:00 in this string.


            e.g. if you send 2020-10-13T16:00:00Z in utc, our system will

            cut off the UTC time zone, and attach the time zone of the pick up point,

            but the date and time will still stay 2020-10-13T16:00:00
          example: "2020-10-13T16:00:00Z"
        deliveredDateTime:
          type: string
          format: date-time
          nullable: true
          description: >
            Delivered date with time in time zone of drop off location.


            The time zone you provide will be ignored, 

            so you have to make sure that the day and the hours are exactly 

            those that you want to store in our system. 


            e.g. if the load has to be delivered at 16:00 in the time zone

            of the drop off point, you have to send us 16:00 in this string.


            e.g. if you send 2020-10-13T16:00:00Z in utc, our system will

            cut off the UTC time zone, and attach the time zone of the pick up point,

            but the date and time will still stay 2020-10-13T16:00:00
          example: "2020-10-13T16:00:00Z"
        bidDateTime:
          type: string
          format: date-time
          nullable: true
          description: The date and time when the bid was created
          example: "2020-10-11T16:00:00Z"
        bidCost:
          type: number
          description: Bid rate
          example: 1000.5
        loadProNumber:
          type: string
          nullable: true
          description: Internal load pro number
          example: Pro#111111
        weight:
          type: number
          format: float
          nullable: true
          description: Total cargo weight in lb
          example: 20000
        commodity:
          type: string
          nullable: true
          description: Commodity description in free form
          example: Steel racks
        brokerComment:
          type: string
          nullable: true
          description: Comment for carrier
          example: Something a broker would comment
        carrierComment:
          type: string
          nullable: true
          description: Comment from carrier
          example: Looks good
        currency:
          $ref: "#/components/schemas/Currency"
      required:
        - carrierName
        - origin
        - destination
        - transportType
        - bidCost
