        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bids_BidObject'
        '400':
          $ref: '#/paths/~1bids/get/responses/400'
        '401':
          $ref: '#/paths/~1bids/get/responses/401'
        '403':
