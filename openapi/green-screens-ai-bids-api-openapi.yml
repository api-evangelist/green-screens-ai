      - lang: Php + Curl
        source: "<?php\n\n$curl = curl_init();\n\ncurl_setopt_array($curl, [\n  CURLOPT_URL => \"https://testapi.greenscreens.ai/v1/bids/by-key/%7Bkey%7D\",\n  CURLOPT_RETURNTRANSFER => true,\n  CURLOPT_ENCODING => \"\",\n  CURLOPT_MAXREDIRS => 10,\n  CURLOPT_TIMEOUT => 30,\n  CURLOPT_HTTP_VERSION => CURL_HTTP_VERSION_1_1,\n  CURLOPT_CUSTOMREQUEST => \"GET\",\n]);\n\n$response = curl_exec($curl);\n$err = curl_error($curl);\n\ncurl_close($curl);\n\nif ($err) {\n  echo \"cURL Error #:\" . $err;\n} else {\n  echo $response;\n}"
components:
  schemas:
    Bids_StopAddress:
      type: object
      description: Location specified by country, city, state and zip code
      properties:
        country:
          type: string
          description: Two letter country code in ISO 3166-1 alpha-2 format
          example: US
        state:
          type: string
          description: State
          example: NY
        city:
          type: string
          description: City
          example: Schenectady
        zip:
          type: string
          description: Zip
          example: '12345'
        type:
          type: string
          enum:
          - CITY
          - ZIP
          example: ZIP
          description: Type of address
      required:
      - country
      - state
      - city
      - zip
      - type
    Bids_BidsUpdateRequest:
      type: object
      properties:
        carrierName:
          type: string
          description: Carrier company name
          example: CarrierCompany
        carrierMC:
          type: string
          description: Carrier MC number
          example: '888015'
        carrierEmail:
          type: string
          nullable: true
          description: User email
          example: carrier@mail.com
        carrierPhone:
          type: string
          nullable: true
          description: Carrier contact phone number
          example: '4112228888'
        origin:
          $ref: '#/components/schemas/Bids_Address'
        destination:
          $ref: '#/components/schemas/Bids_Address'
        extraStops:
          $ref: '#/components/schemas/Bids_StopsInput'
        transportType:
          $ref: '#/components/schemas/Bids_TransportType'
        pickupDateTime:
          type: string
          format: date-time
          nullable: true
          description: "Pick up date with time in time zone of the pick up location.\n\nThe time zone you provide will be ignored, \nso you have to make sure that the day and the hours are exactly \nthose that you want to store in our system. \n\ne.g. if the load has to be delivered at 16:00 in the time zone\nof the drop off point, you have to send us 16:00 in this string.\n\ne.g. if you send 2020-10-13T16:00:00Z in utc, our system will\ncut off the UTC time zone, and attach the time zone of the pick up point,\nbut the date and time will still stay 2020-10-13T16:00:00\n"
          example: '2020-10-13T16:00:00Z'
        deliveredDateTime:
          type: string
          format: date-time
          nullable: true
          description: "Delivered date with time in time zone of drop off location.\n\nThe time zone you provide will be ignored, \nso you have to make sure that the day and the hours are exactly \nthose that you want to store in our system. \n\ne.g. if the load has to be delivered at 16:00 in the time zone\nof the drop off point, you have to send us 16:00 in this string.\n\ne.g. if you send 2020-10-13T16:00:00Z in utc, our system will\ncut off the UTC time zone, and attach the time zone of the pick up point,\nbut the date and time will still stay 2020-10-13T16:00:00\n"
          example: '2020-10-13T16:00:00Z'
        bidDateTime:
          type: string
          format: date-time
          nullable: true
          description: The date and time when the bid was created
          example: '2020-10-11T16:00:00Z'
        bidCost:
          type: number
          description: Bid rate
          example: 1000.5
        loadProNumber:
          type: string
          nullable: true
          description: Internal load pro number
          example: Pro#111111
        weight:
          type: number
          format: float
          nullable: true
          description: Total cargo weight in lb
          example: 20000
        commodity:
          type: string
          nullable: true
          description: Commodity description in free form
          example: Steel racks
        brokerComment:
          type: string
          nullable: true
          description: Comment for carrier
          example: Something a broker would comment
        carrierComment:
          type: string
          nullable: true
          description: Comment from carrier
          example: Looks good
        wasViewed:
          type: boolean
          description: States whether the bid was viewed by the broker after being accepted by carrier
          example: false
        currency:
          $ref: '#/components/schemas/Bids_Currency'
      required:
      - carrierName
      - origin
      - destination
      - transportType
      - bidCost
    Bids_BidActionRequest:
      type: object
      description: Carries data necessary for accepting a bid
      properties:
        key:
          type: string
          description: Key of the bid which you want to accept
          example: c5d1cfa8-228b-11eb-adc1-0242ac120002
        bidCost:
          type: number
          description: Bid rate from user
          example: 1000.5
        carrierName:
          type: string
          description: Carrier company name
          example: Carrierr Transportation
        carrierMC:
          type: string
          description: Carrier MC number
          example: '888015'
        carrierComment:
          type: string
          description: Comment for broker
          example: Looks good
        currency:
          $ref: '#/components/schemas/Bids_Currency'
      required:
      - key
      - bidCost
      - carrierName
    Bids_BidsResponse:
      type: object
      description: Object containing an array of bids
      properties:
        items:
          type: array
          description: Array of bids
          items:
            $ref: '#/components/schemas/Bids_BidObject'
      required:
      - items
    Bids_BidsSendRequestCarrierCarrierInfo:
      type: object
      description: Describes the carrier to whom the bid request is sent
      properties:
        name:
          type: string
          description: Carrier company name
          example: CarrierCompany
        mc:
          type: string
          description: Carrier MC number
          example: '888015'
        dot:
          type: string
          description: Carrier DOT number
          example: '87650005'
        phone:
          type: string
          description: Carrier contact phone number
          example: '4112228888'
        email:
          type: string
          description: Carrier contact email address
          example: carrier@mail.com
    Bids_BidResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Bid ID in the platform
          example: 12345
        key:
          type: string
          description: Unique key used to create a link to the bid in the platform
          example: deedc41f-7eb2-4c36-9d35-fb6958a43771
      required:
      - id
      - key
    Bids_Error:
      type: object
      description: A common api error object
      properties:
        code:
          type: string
          description: unique string identifier of the error
        message:
          type: string
          description: human readable error message
      required:
      - code
      - message
      example:
        code: invalid_request
        message: Your ClientId is invalid
    Bids_BidObject:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: id of the bid
          example: 23456
        userEmail:
          type: string
          description: Email of the owner of the bid
          example: buddy@greenscreens.ai
        pickupDateTime:
          type: string
          format: date-time
          description: Related load pickup date
          example: '2020-09-14T16:00:00Z'
        deliveredDateTime:
          type: string
          format: date-time
          description: Related load delivery date
          example: '2020-09-14T16:00:00Z'
        createdDate:
          type: string
          format: date-time
          description: Bid creation date
          example: '2020-09-14T16:00:00Z'
        bidStatus:
          $ref: '#/components/schemas/Bids_BidStatus'
        bidCost:
          type: number
          description: Bid rate
          example: 1000.5
        wasViewed:
          type: boolean
          description: States whether the bid was viewed by the broker after being accepted by carrier
          example: false
        carrierName:
          type: string
          description: Carrier company name
          example: Carrierr Transportation
        carrierMC:
          type: string
          description: Carrier MC number
          example: '888015'
        carrierPhone:
          type: string
          description: Carrier contact phone number
          example: '4112228888'
        carrierEmail:
          type: string
          description: Carrier contact email
          example: test@greenscreens.ai
        transportType:
          $ref: '#/components/schemas/Bids_TransportType'
        origin:
          $ref: '#/components/schemas/Bids_Address'
        destination:
          $ref: '#/components/schemas/Bids_Address'
        extraStops:
          $ref: '#/components/schemas/Bids_Stops'
        loadProNumber:
          type: string
          description: Internal load pro number
        weight:
          description: Total cargo weight in lb
          type: number
          format: float
          example: 20000
        commodity:
          type: string
          description: Commodity description in free form
          example: Very important load
        brokerComment:
          type: string
          description: Comment for carrier
          example: Please, be carefully with my load
        carrierComment:
          type: string
          description: Comment for broker
          example: Looks good
        currency:
          type: string
          description: Code of the currency of the response. Format is ISO 4217.
          example: USD
      required:
      - userEmail
      - bidStatus
      - pickupDate
      - deliveredDate
      - bidCost
      - carrierName
      - carrierEmail
      - transportType
      - origin
      - destination
      - extraStops
      - wasViewed
      - currency
    Bids_StopInput:
      type: object
      description: Contains the stop information e.g. address
      properties:
        order:
          type: integer
          description: Stop order, starting from 0
          example: 0
        address:
          $ref: '#/components/schemas/Bids_StopAddressInput'
        type:
          type: string
          description: 'Action performed with the cargo at this stop.


            Leave this field empty if you do not know the stop type.

            '
          enum:
          - LOAD
          - UNLOAD
          - BOTH
          example: LOAD
        appointmentDateTime:
          type: string
          format: date-time
          description: 'Date and time when the truck has to arrive at this stop.


            Provide the time zone of the stop location if possible.

            '
          example: '2020-10-13T16:00:00Z'
      required:
      - order
      - address
    Bids_Stops:
      type: array
      description: Stops list
      items:
        $ref: '#/components/schemas/Bids_Stop'
      example:
      - order: 0
        address:
          country: US
          city: Red Bluff
          state: CA
          zip: '96080'
          type: ZIP
        type: LOAD
        appointmentDateTime: '2020-10-14T16:00:00Z'
      - order: 1
        address:
          country: US
          city: Redding
          state: CA
          zip: '96002'
          type: CITY
        type: UNLOAD
        appointmentDateTime: '2020-10-15T16:00:00Z'
    Bids_StopsInput:
      type: array
      description: Stops list
      items:
        $ref: '#/components/schemas/Bids_StopInput'
      example:
      - order: 0
        address:
          country: US
          zip: '96080'
        type: LOAD
        appointmentDateTime: '2020-10-14T16:00:00Z'
      - order: 1
        address:
          country: US
          city: Redding
          state: CA
        type: UNLOAD
        appointmentDateTime: '2020-10-15T16:00:00Z'
