      - Bids_bearerAuth: []
      parameters:
      - in: query
        name: transportType
        schema:
          type: string
          enum:
          - VAN
          - REEFER
          - FLATBED
          - HOTSHOT
          description: Transport type
          example: VAN
        required: true
      - in: query
        name: originCountry
        schema:
          type: string
          example: US
        description: "Origin country. \nTwo letter country code in ISO 3166-1 alpha-2 format\n"
      - in: query
        name: originState
        schema:
          type: string
          description: Origin state
          example: NY
      - in: query
        name: originCity
        schema:
          type: string
          description: Origin city
          example: Schenectady
      - in: query
        name: originZip
        schema:
          type: string
          example: '12345'
          description: Origin area zip
        required: true
      - in: query
        name: destinationCountry
        schema:
          type: string
          example: US
        description: "Destination country. \nTwo letter country code in ISO 3166-1 alpha-2 format\n"
      - in: query
        name: destinationState
        schema:
          type: string
          description: Destination state
          example: IL
      - in: query
        name: destinationCity
        schema:
          type: string
          description: Destination city
          example: Chicago
      - in: query
        name: destinationZip
        schema:
          type: string
          example: '60636'
          description: Destination area zip
        required: true
      - in: query
        name: hasExtraStops
        schema:
          type: boolean
          example: true
          description: 'Signifies whether the requested lane has extra stops or not.


