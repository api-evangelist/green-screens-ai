openapi: 3.0.2
info:
  title: Prediction
  version: 2.5.3
  description: >-
    Prediction service v2


    #### This is an old api and it will be deprecated soon. <a href="/prediction/v3/swagger/index.html" target="_blank">View latest version - v3, here</a>
