  /pricing/tpl-pricing:
    servers:
    - url: https://testapi.greenscreens.ai/v1
      description: Testing server (dev environment)
    - url: https://sandboxapi.greenscreens.ai/v1
      description: Sandbox server (as stable as production, but has no data)
    - url: https://api.greenscreens.ai/v1
      description: Production server (uses live data)
    post:
      tags:
      - Pricing
      summary: Calculate pricing, based on TPL data
      description: "Returns all pricing suggestions: statistical, rule related, etc. \nintended for TPL pricing and calculated using TPL data.\n\nMost of the fields in the request and response are optional.\n\nResponse fields are related to request fields e.g. if you do not provide\nthe customer name in the request, there will be no customer related\npricing data in the response, and the pricing rules that use customer name predicates\nwill not be found.\n\nTo get the most possible data in the response, provide all the data you can \nin the request. However if for example you only need customer related pricing data,\nyou can provide only the customer name in the request.\n\nAlso note that if providing addresses, \norigin and destination country is required.\nThe state code can be provided without city and zip, \nand the city name can be provided without a zip code,\nand the zip code can be provided without a city or a state.\nThis will also affect what kind of rules are found and what statistical data\nis calculated and returned.\n\nParameter notes:\n* __region__ - defaults to ZIP if not provided\n"
      operationId: pricingTplPricing
      security:
      - Pricing_bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pricing_PricingRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pricing_PricingResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pricing_Error'
              examples:
                error400Example:
                  value:
                    code: missing_required_parameter
                    message: Your request was missing a {par_name} parameter
        '401':
          description: Unauthenticated
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pricing_Error'
              examples:
                error404Example:
                  value:
                    code: item_not_found
                    message: Item not found
        '422':
          description: Unprocessable Entity with multiple errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pricing_Error422UnprocessableEntityMulti'
              examples:
                error422MultiExample:
                  value:
                    code: request_validation
                    message: You have one or more errors in request structure
                    errors:
                    - field: carrierName
                      message: field contains wrong data type (int), should be string
                      value: '22'
                    - field: shipperId
                      message: 'shipperId: must not be null'
                      value: null
                    - field: loadSource.loadId
                      message: 'loadId: must not be null'
                      value: null
        '424':
          description: Failed Dependency.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pricing_Error'
              examples:
                error424Example:
                  value:
                    code: distance_calculation_error
                    message: 'Unable to calculate distance between zips {key}, reason:  {exc}'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pricing_Error'
              examples:
                error429TooManyRequests:
                  value:
                    code: too_many_requests
                    message: Request limit exceeded
        '500':
          description: Unhandled server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pricing_Error'
              examples:
                error500Example:
                  value:
                    code: internal_error
                    message: Internal server error
      x-codeSamples:
      - lang: Node + Request
        source: "const request = require('request');\n\nconst options = {\n  method: 'POST',\n  url: 'https://testapi.greenscreens.ai/v1/pricing/tpl-pricing',\n  headers: {\n    'content-type': 'application/json',\n    Authorization: 'Bearer REPLACE_BEARER_TOKEN'\n  },\n  body: {\n    transportType: 'VAN',\n    stops: [\n      {\n        order: 0,\n        address: {country: 'US', city: 'Red Bluff', state: 'CA', zip: '96080'}\n      },\n      {order: 1, address: {country: 'US', city: 'Redding', state: 'CA', zip: '96002'}}\n    ],\n    region: 'ZIP',\n    customerName: 'Test Customer',\n    pickupDate: '2020-01-13T16:00:00Z',\n    deliveryDate: '2020-01-13T16:00:00Z',\n    weight: 10000,\n    commodity: 'Apples',\n    targetBuyCost: 1000,\n    confidenceLevel: 65,\n    currency: 'USD',\n    pricingTypeGroup: 'SPOT'\n  },\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
