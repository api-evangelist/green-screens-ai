components:
  schemas:
    Pricing_TransitTimeRange:
      type: object
      allOf:
      - $ref: '#/components/schemas/Pricing_FloatRange'
      description: "Transit time range to which the rule is applicable.\n\nAt least one of the range boundaries has to be provided.\n\nIf only one range boundary is provided, it means that the range is either \n`<= 'to'` or `>= 'from'`\n"
      properties:
        from:
          type: number
          format: float
          description: Minimum transit time in hours
          minimum: 0
          example: 10
        to:
          type: number
          format: float
          description: Maximum transit time in hours
          minimum: 0
          example: 24
    Pricing_PricingMarketplaceMyBrokerPartnersResponse:
      type: object
      description: A response with a list of brokers and their sell rates
      properties:
        brokers:
          type: array
          description: 'Array of brokers that signified that they want to work with you

            (participate in your marketplace)

            '
          items:
            $ref: '#/components/schemas/Pricing_PricingMarketplaceMyBrokerPartnersResponseBroker'
        currency:
          type: string
          description: "Code of the currency of any monetary values in the response. \n\nFormat is ISO 4217 (a three letter code e.g. 'USD')\n"
          example: USD
      required:
      - brokers
      - currency
    Pricing_RuleRequestConditions:
      type: object
      description: "Conditions in which this rule is applicable.\n\nWhen multuple conditions are provided the rule is only applied \nif all of them are met.\n"
      properties:
        commodity:
          type: array
          description: 'List of commodities to which the rule is applicable.

            At least one commodity from this list has to match for the rule to apply

            '
          items:
            type: string
          example:
          - Apples
        confidenceLevel:
          $ref: '#/components/schemas/Pricing_ConfidenceLevelRange'
        customers:
          type: array
          description: "List of customers to which the rule is applicable. \nAt least one customer from this list has to match for the rule to apply.\n"
          items:
            type: string
            description: Customer name
          example:
          - LTR and Co
          - CocaCola
          - Walmart
        lanes:
          type: array
          description: "List of lanes to which the rule is applicable. \nAt least one lane from this list has to match for the rule to apply.\n"
          items:
            $ref: '#/components/schemas/Pricing_RuleRequestLane'
        lengthOfHaul:
          $ref: '#/components/schemas/Pricing_LengthOfHaulRange'
        matchingTime:
          $ref: '#/components/schemas/Pricing_MatchingTimeRange'
        transitTime:
          $ref: '#/components/schemas/Pricing_TransitTimeRange'
        transportTypes:
          type: array
          maxItems: 3
          description: 'List of transport types to which the rule is applicable.

            At least one transport type from this list has to match for the rule to apply

            '
          items:
            $ref: '#/components/schemas/Pricing_TransportType'
        users:
          type: array
          description: "List of users to whom the rule is applicable. \nAt least one user from this list has to match for the rule to apply\n"
          items:
            type: string
        weight:
          $ref: '#/components/schemas/Pricing_WeightRange'
        stopsCount:
          $ref: '#/components/schemas/Pricing_StopsCountRange'
        mileageDifference:
          $ref: '#/components/schemas/Pricing_MileageDifferenceRange'
    Pricing_GeographicalAreaLane:
      type: string
      enum:
      - CITY
      - CITY_ZIP
      - ZIP_CITY
      - ZIP
      description: "Determines the size of the area around origin and destination points, \nthat will be searched for the related data.\n* CITY - narrow, city wide, area\n* ZIP - narrow, five digit zip, area\n* CITY_ZIP - a special option that sets origin area to CITY and destination area to ZIP\n* ZIP_CITY - a special option that sets origin area to ZIP and destination area to CITY\n"
      example: ZIP
    Pricing_FlatAdjustmentEffectInput:
      type: object
      description: 'In the default interpretation this effect increases the buy cost

        by a flat `amount` of the specified `currency` to get the sell cost

        '
      properties:
        amount:
          type: number
          description: 'The flat monetary amount by which the buy cost should be increased

            '
          example: 15
        currency:
          $ref: '#/components/schemas/Pricing_Currency'
      required:
      - amount
    Pricing_Error422UnprocessableEntityMulti:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        errors:
          type: array
          description: list of errors
          items:
            $ref: '#/components/schemas/Pricing_RequestValidationError'
      required:
      - code
      - message
      - errors
      example:
        code: request_validation
        message: You have one or more errors in request structure
        errors:
        - field: carrierName
          message: field contains wrong data type (int), should be string
          value: '22'
        - field: shipperId
          message: 'shipperId: must not be null'
          value: null
        - field: loadSource.loadId
          message: 'loadId: must not be null'
          value: null
    Pricing_WeightRange:
      type: object
      allOf:
      - $ref: '#/components/schemas/Pricing_IntegerRange'
      description: "Weight range, of the cargo, to which the rule is applicable.\n\nAt least one of the range boundaries has to be provided.\n\nIf only one range boundary is provided, it means that the range is either \n`<= 'to'` or `>= 'from'`\n"
      properties:
        from:
          type: integer
          description: Minimum weight in lb
          minimum: 0
          example: 0
        to:
          type: integer
          description: Maximum weight in lb
          minimum: 0
          example: 45000
    Pricing_Currency:
      type: string
      enum:
      - USD
      - CAD
      description: "Currency code in ISO 4217 format (three letter code, e.g. USD)\n\n_If not provided, defaults to the currency set in the profile \nof currently authenticated user (or currently authenticated company \nif there is no user or user profile setting)_\n"
      example: USD
    Pricing_PricingResponse:
      type: object
      description: A collection of all the pricing options found
      properties:
        default:
          $ref: '#/components/schemas/Pricing_DefaultPricingCalculation'
        laneHistorical:
          $ref: '#/components/schemas/Pricing_PricingStatisticsCalculation'
        customerHistorical:
          $ref: '#/components/schemas/Pricing_PricingStatisticsCalculation'
        customerOnLaneHistorical:
          $ref: '#/components/schemas/Pricing_PricingStatisticsCalculation'
        priorityRule:
          $ref: '#/components/schemas/Pricing_PriorityRuleCalculation'
        combinationRules:
          $ref: '#/components/schemas/Pricing_CombinationRulesCalculation'
        suggested:
          $ref: '#/components/schemas/Pricing_SuggestedPricing'
        currency:
          type: string
          description: "Code of the currency of any monetary values in the response. \n\n**Except flat pricing effect descriptors**, those have their own currencies. \n\nFormat is ISO 4217 (a three letter code e.g. 'USD')\n"
          example: USD
      required:
      - currency
    Pricing_StopsCountRange:
      type: object
      description: "Range of the stops count of the route to which the rule is applicable.\n\nStops count includes origin and destination i.e. route with one extra stop will have 3 stops in total.\n\nAt least one of the range boundaries has to be provided.\n\nIf only one range boundary is provided, it means that the range is either \n`<= 'to'` or `>= 'from'`\n"
      allOf:
      - $ref: '#/components/schemas/Pricing_IntegerRange'
      properties:
        from:
          type: integer
          minimum: 0
          description: Minimum stops count
          example: 3
        to:
          type: integer
          minimum: 0
          description: Maximum stops count
          example: 10
    Pricing_MatchingTimeRange:
      type: object
      allOf:
      - $ref: '#/components/schemas/Pricing_FloatRange'
      description: "Matching time range to which the rule is applicable.\n\nAt least one of the range boundaries has to be provided.\n\nIf only one range boundary is provided, it means that the range is either \n`<= 'to'` or `>= 'from'`\n"
      properties:
        from:
          type: number
          format: float
          description: Minimum matching time in hours
          minimum: 0
          example: 20
        to:
          type: number
          format: float
          description: Maximum matching time in hours
          minimum: 0
          example: 30
    Pricing_CombinationRuleEffectsInput:
      type: object
      description: 'The effects this rule will have on the price calculation.


        __Only one effect is allowed per rule__

        '
      properties:
        percentageAdjustment:
          $ref: '#/components/schemas/Pricing_PercentageAdjustmentEffect'
        flatAdjustment:
          $ref: '#/components/schemas/Pricing_FlatAdjustmentEffectInput'
    Pricing_DefaultPricingCalculation:
      type: object
      description: "Contains the default pricing effects \nand if possible a calculated `targetSellCost`\n"
      properties:
        effects:
          $ref: '#/components/schemas/Pricing_DefaultPricingEffects'
        targetSellCost:
          type: number
          example: 1250
          description: 'Flat target sell cost calculated by applying the default pricing effects

            to the provided flat buy cost

            '
      required:
      - effects
    Pricing_CombinationRuleEffects:
      type: object
      description: The effects this rule will have on the price calculation
      properties:
        percentageAdjustment:
          $ref: '#/components/schemas/Pricing_PercentageAdjustmentEffect'
        flatAdjustment:
          $ref: '#/components/schemas/Pricing_FlatAdjustmentEffect'
    Pricing_PriorityRule:
      type: object
      description: Priority pricing rule
      properties:
        id:
          type: integer
          format: int64
          description: Id of the rule
          example: 12345
        name:
          type: string
          description: Name of the rule
          example: Customer`s rule
        priority:
          type: integer
          description: Priority of the rule
          example: 3
        active:
          type: boolean
          description: Status of the rule
          example: false
        conditions:
          $ref: '#/components/schemas/Pricing_RuleConditions'
        effects:
          $ref: '#/components/schemas/Pricing_PriorityRuleEffects'
        pricingTypeGroup:
          $ref: '#/components/schemas/Pricing_PricingRuleGroup'
      required:
      - id
      - name
      - priority
      - active
      - conditions
      - effects
    Pricing_RuleRequestLocation:
      type: object
      description: Lane stop
      properties:
        type:
          type: string
          enum:
          - ANYWHERE
          - STATE
          - CITY
          - MARKET
          example: ANYWHERE
          description: "The location type. \n\nFor type ANYWHERE no fields are required.\n\nFor type STATE - \"country\" and \"state\" fields are required.\n\nFor type CITY - \"country\", \"state\" and \"city\" fields are required.\n\nFor type MARKET - \"country\" and \"marketCode\" fields are required.\n"
        country:
          type: string
          description: Two letter country code in ISO 3166-1 alpha-2 format
          example: US
        state:
          type: string
          description: State
          example: NY
        city:
          type: string
          description: City
          example: Schenectady
        marketCode:
          type: string
          description: Market code
          example: NY_ALB
      required:
      - type
    Pricing_DefaultPricingEffects:
      type: object
      description: 'The default pricing effects that are to be used for the sell cost calculation

        if no other pricing options are found

        '
      properties:
        percentageAdjustment:
          $ref: '#/components/schemas/Pricing_PercentageAdjustmentEffect'
        flatAdjustment:
          $ref: '#/components/schemas/Pricing_FlatAdjustmentEffect'
        setSellCost:
          $ref: '#/components/schemas/Pricing_SetSellCostEffect'
    Pricing_Stops:
      type: array
      description: A list of stops
      minItems: 2
      maxItems: 12
      items:
        $ref: '#/components/schemas/Pricing_Stop'
      example:
      - order: 0
        address:
          country: US
          city: Red Bluff
          state: CA
          zip: '96080'
      - order: 1
        address:
          country: US
          city: Redding
          state: CA
          zip: '96002'
    Pricing_SuggestedPricing:
      type: object
      description: "The pricing that we suggest to be used on this lane.\n\nThis is based off of all the other pricing options found and \ncalculated using a priority algorithm. You can either trust us and use this\nto do your quote pricing, or you can choose from any of the other fields\navailable in the response\n"
      properties:
        name:
          type: string
          enum:
          - default
          - laneHistorical
          - customerHistorical
          - customerOnLaneHistorical
          - priorityRule
          - combinationRules
          description: 'The name of the pricing option suggested to be used.


            The values are the names of the other fields of the response.

            '
          example: priorityRule
        targetSellCost:
          type: number
          example: 1250
          description: "Flat target sell cost calculated by applying the suggested pricing effect \nto the provided flat buy cost\n"
      required:
      - name
    Pricing_ConfidenceLevelRange:
      type: object
      allOf:
      - $ref: '#/components/schemas/Pricing_IntegerRange'
      description: "Confidence level range to which the rule is applicable.\n\nAt least one of the range boundaries has to be provided.\n\nIf only one range boundary is provided, it means that the range is either \n`<= 'to'` or `>= 'from'`\n"
      properties:
        from:
          type: integer
          description: Minimum confidence level in miles
          minimum: 0
          maximum: 100
          example: 70
        to:
          type: integer
          description: Maximum confidence level in miles
          minimum: 0
          maximum: 100
          example: 100
    Pricing_Address:
      type: object
      description: 'Location specified by country, city, state and zip code.

        * Country is required

        * Either city-state pair or zip code is required

        * All four parameters can be passed together


        (in case of city-state pair our platform will determine the zip code

        and in case of a zip code, our platform will determine the city and the state)

        '
      properties:
        country:
          type: string
          description: Two letter country code in ISO 3166-1 alpha-2 format
          example: US
        state:
          type: string
          description: State
          example: NY
        city:
          type: string
          description: City
          example: Schenectady
        zip:
          type: string
          description: Zip
          example: '12345'
      required:
      - country
    Pricing_CombinationRule:
      type: object
      description: Combination pricing rule
      properties:
        id:
          type: integer
          format: int64
          description: Id of the rule
          example: 12345
        name:
          type: string
          description: Name of the pricing rule
          example: Customer`s rule
        active:
          type: boolean
          description: Status of the rule
          example: false
        conditions:
          $ref: '#/components/schemas/Pricing_RuleConditions'
        effects:
          $ref: '#/components/schemas/Pricing_CombinationRuleEffects'
        pricingTypeGroup:
          $ref: '#/components/schemas/Pricing_PricingRuleGroup'
      required:
      - id
      - name
      - active
      - conditions
      - effects
    Pricing_PricingPriorityRuleRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the rule
          example: Customer`s rule
        priority:
          type: integer
          description: Priority of the rule
          example: 3
        active:
          type: boolean
          description: Status of the rule
          example: false
        conditions:
          $ref: '#/components/schemas/Pricing_RuleRequestConditions'
        effects:
          $ref: '#/components/schemas/Pricing_PriorityRuleEffectsInput'
        pricingTypeGroup:
          $ref: '#/components/schemas/Pricing_PricingRuleGroup'
      required:
      - name
      - priority
      - active
      - conditions
      - effects
    Pricing_SetSellCostEffect:
      type: object
      description: "In the default interpretation this effect \nsets the specified `amount` of the specified `currency` \nas the final sell cost\n"
      properties:
        amount:
          type: number
          description: 'The flat monetary amount to set as the sell cost

            '
          example: 15
        currency:
          type: string
          description: 'Code of the currency used in this effect.

            Format is ISO 4217 (a three letter code e.g. ''USD'')

            '
          example: USD
      required:
      - amount
      - currency
    Pricing_RequestValidationError:
      type: object
      description: Request validation error
      properties:
        field:
          type: string
          description: Name of the field that did not pass validation
          example: transportType
        message:
          type: string
          description: Human readable error mesage explaining why validation failed
          example: SpaceXDragon transportType is not supported. Valid values are [VAN, FLATBED, ...]
        value:
          type: string
          nullable: true
          description: Value of the field that did not pass validation
          example: SpaceXDragon
      required:
      - field
      - message
    Pricing_PricingCombinationRuleRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the rule
          example: Customer`s rule
        active:
          type: boolean
          description: Status of the rule
          example: false
        conditions:
          $ref: '#/components/schemas/Pricing_RuleRequestConditions'
        effects:
          $ref: '#/components/schemas/Pricing_CombinationRuleEffectsInput'
        pricingTypeGroup:
          $ref: '#/components/schemas/Pricing_PricingRuleGroup'
      required:
      - name
      - active
      - conditions
      - effects
    Pricing_LengthOfHaulRange:
      type: object
      allOf:
      - $ref: '#/components/schemas/Pricing_IntegerRange'
      description: "Range of the distance of the route to which the rule is applicable.\n\nAt least one of the range boundaries has to be provided.\n\nIf only one range boundary is provided, it means that the range is either \n`<= 'to'` or `>= 'from'`\n"
      properties:
        from:
          type: integer
          description: Minimum distance in miles
          minimum: 0
          example: 50
        to:
          type: integer
          description: Maximum distance in miles
          minimum: 0
          example: 250
    Pricing_CombinationRulesCalculation:
      type: object
      description: 'Contains applicable combination rules and if possible a calculated `targetSellCost`

        '
      properties:
        rules:
          type: array
          description: List of applicable combination rules
          items:
            $ref: '#/components/schemas/Pricing_CombinationRule'
        targetSellCost:
          type: number
          example: 1250
          description: "Flat target sell cost calculated by applying combination rules \nto the provided flat buy cost\n"
      required:
      - rules
    Pricing_RuleLane:
      type: object
      description: Lane description object
      properties:
        origins:
          $ref: '#/components/schemas/Pricing_RuleLocations'
        destinations:
          $ref: '#/components/schemas/Pricing_RuleLocations'
      required:
      - origins
      - destinations
    Pricing_PricingStatisticsCalculation:
      type: object
      description: "Contains historical pricing statistics \nand if possible a calculated `targetSellCost`\n"
      properties:
        pricing:
          $ref: '#/components/schemas/Pricing_PricingStatistics'
        targetSellCost:
          type: number
          example: 1250
          description: 'Flat target sell cost calculated by applying the rule

            to the provided flat buy cost

            '
      required:
      - pricing
    Pricing_PricingRequest:
      type: object
      description: A set of fields used during pricing calculation
      properties:
        transportType:
          $ref: '#/components/schemas/Pricing_TransportType'
        stops:
          $ref: '#/components/schemas/Pricing_Stops'
        region:
          $ref: '#/components/schemas/Pricing_GeographicalAreaLane'
        customerName:
          type: string
          description: Customer name
          example: Test Customer
        pickupDate:
          type: string
          format: date-time
          description: Pick up date in time zone of origin
          example: '2020-01-13T16:00:00Z'
        deliveryDate:
          type: string
          format: date-time
          description: Delivery date in time zone of the destination
          example: '2020-01-13T16:00:00Z'
        weight:
          type: number
          format: float
          description: Weight of the cargo in lb
          example: 10000
        commodity:
          type: string
          description: Name of the commodity
          example: Apples
        targetBuyCost:
          type: number
          description: "The flat buy cost that the calculated pricing effect will be applied to, \nin order to calculate the flat target sell cost\n"
          example: 1000
        confidenceLevel:
          type: integer
          minimum: 0
          maximum: 100
          description: "Buy rate prediction confidence level \nfrom the rate prediction endpoint response\n"
          example: 65
        currency:
          $ref: '#/components/schemas/Pricing_Currency'
        pricingTypeGroup:
          $ref: '#/components/schemas/Pricing_PricingRuleGroup'
    Pricing_IntegerRange:
      type: object
      properties:
        from:
          type: integer
          minimum: 0
          example: 50
        to:
          type: integer
          minimum: 0
          example: 250
    Pricing_RuleRequestLocations:
      type: array
      description: A list of locations that the rule is applicable to
      items:
        $ref: '#/components/schemas/Pricing_RuleRequestLocation'
      example:
      - type: ANYWHERE
      - type: STATE
        country: US
        state: IL
      - type: CITY
        country: US
        state: IL
        city: Chicago
      - type: MARKET
        country: US
        marketCode: NY_ALB
    Pricing_MileageDifferenceRange:
      type: object
      allOf:
      - $ref: '#/components/schemas/Pricing_IntegerRange'
      description: 'Range of the stops count of the route to which the rule is applicable.


        At least one of the range boundaries has to be provided.


        If only one range boundary is provided, it means that the range is either

        `<= ''to''` or `>= ''from''`

        '
      properties:
        from:
          type: integer
          description: Minimum difference in miles
          minimum: 0
          example: 50
        to:
          type: integer
          description: Maximum difference in miles
          minimum: 0
          example: 250
    Pricing_SetSellCostEffectInput:
      type: object
      description: "In the default interpretation this effect \nsets the specified `amount` of the specified `currency` \nas the final sell cost\n"
      properties:
        amount:
          type: number
          description: 'The flat monetary amount to set as the sell cost

            '
          example: 15
        currency:
          $ref: '#/components/schemas/Pricing_Currency'
      required:
      - amount
    Pricing_RuleRequestLane:
      type: object
      description: A lane that the rule is applicable to
      properties:
        origins:
          $ref: '#/components/schemas/Pricing_RuleRequestLocations'
        destinations:
          $ref: '#/components/schemas/Pricing_RuleRequestLocations'
      required:
      - origins
      - destinations
    Pricing_RuleConditions:
      type: object
      description: "Conditions in which this rule is applicable.\n\nWhen multuple conditions are provided the rule is only applied \nif all of them are met\n"
      properties:
        commodity:
          type: array
          description: 'List of commodities to which the rule is applicable.

            At least one commodity from this list has to match for the rule to apply

            '
          items:
            type: string
          example:
          - Apples
        confidenceLevel:
          $ref: '#/components/schemas/Pricing_ConfidenceLevelRange'
        customers:
          type: array
          description: "List of customers to which the rule is applicable. \nAt least one customer from this list has to match for the rule to apply\n"
          items:
            type: string
            description: Customer name
          example:
          - LTR and Co
          - CocaCola
          - Walmart
        lanes:
          type: array
          description: "List of lanes to which the rule is applicable. \nAt least one lane from this list has to match for the rule to apply\n"
          items:
            $ref: '#/components/schemas/Pricing_RuleLane'
        lengthOfHaul:
          $ref: '#/components/schemas/Pricing_LengthOfHaulRange'
        matchingTime:
          $ref: '#/components/schemas/Pricing_MatchingTimeRange'
        transitTime:
          $ref: '#/components/schemas/Pricing_TransitTimeRange'
        transportTypes:
          type: array
          maxItems: 2
          description: 'List of transport types to which the rule is applicable.

            At least one transport type from this list has to match for the rule to apply

            '
          items:
            $ref: '#/components/schemas/Pricing_TransportType'
        users:
          type: array
          description: "List of users to whom the rule is applicable. \nAt least one user from this list has to match for the rule to apply\n"
          items:
            type: string
        weight:
          $ref: '#/components/schemas/Pricing_WeightRange'
        stopsCount:
          $ref: '#/components/schemas/Pricing_StopsCountRange'
        mileageDifference:
          $ref: '#/components/schemas/Pricing_MileageDifferenceRange'
    Pricing_PercentageAdjustmentEffect:
      type: object
      description: 'In the default interpretation this effect marks up the buy cost

        by some `percentage` to get the sell cost

        '
      properties:
        percentage:
          type: number
          description: The percentage by which the buy cost should be marked up
          example: 15
      required:
      - percentage
    Pricing_Error:
      type: object
      description: A common api error object
      properties:
        code:
          type: string
          description: unique string identifier of the error
        message:
          type: string
          description: human readable error message
      required:
      - code
      - message
      example:
        code: invalid_request
        message: Your ClientId is invalid
    Pricing_FloatRange:
      type: object
      properties:
        from:
          type: number
          format: float
          minimum: 0
          example: 20
        to:
          type: number
          format: float
          minimum: 0
          example: 30
    Pricing_PricingPriorityRulesResponse:
      type: object
      properties:
        rules:
          type: array
          description: List of rules
          items:
            $ref: '#/components/schemas/Pricing_PriorityRule'
      required:
      - rules
    Pricing_PricingCombinationRulesResponse:
      type: object
      properties:
        rules:
          type: array
          description: List of combination rules
          items:
            $ref: '#/components/schemas/Pricing_CombinationRule'
      required:
      - rules
    Pricing_TransportType:
      type: string
      enum:
      - VAN
      - REEFER
      - FLATBED
      - HOTSHOT
      description: "Transport type\n\nIf you would like Hotshot predictions, reach out to your CSM and DA. \nThe model will not work properly without your hotshot data effectively filtered and imported into the model.\n"
      example: VAN
    Pricing_Stop:
      type: object
      description: Contains the stop information e.g. address
      properties:
        order:
          type: integer
          description: Stop order, starting from 0
          example: 0
          minimum: 0
        address:
          $ref: '#/components/schemas/Pricing_Address'
      required:
      - order
      - address
    Pricing_PriorityRuleEffects:
      type: object
      description: The effects this rule will have on the price calculation
      properties:
        percentageAdjustment:
          $ref: '#/components/schemas/Pricing_PercentageAdjustmentEffect'
        flatAdjustment:
          $ref: '#/components/schemas/Pricing_FlatAdjustmentEffect'
        setSellCost:
          $ref: '#/components/schemas/Pricing_SetSellCostEffect'
    Pricing_PricingStatistics:
      type: object
      description: Statistical pricing percentages based on your historical load data
      properties:
        average:
          type: number
          description: Average pricing percentage
          example: 11
        minimum:
          type: number
          description: Minimum pricing percentage
          example: 10
        maximum:
          type: number
          description: Maximum pricing percentage
          example: 13
      required:
      - average
      - minimum
      - maximum
    Pricing_RuleLocations:
      type: array
      description: A list of locations that the rule is applicable to
      items:
        $ref: '#/components/schemas/Pricing_RuleLocation'
      example:
      - type: ANYWHERE
      - type: STATE
        country: US
        state: IL
      - type: CITY
        country: US
        state: IL
        city: Chicago
      - type: MARKET
        country: US
        marketCode: NY_ALB
        marketName: Albany Market
    Pricing_FlatAdjustmentEffect:
      type: object
      description: 'In the default interpretation this effect increases the buy cost

        by a flat `amount` of the specified `currency` to get the sell cost

        '
      properties:
        amount:
          type: number
          description: 'The flat monetary amount by which the buy cost should be increased

            '
          example: 15
        currency:
          type: string
          description: 'Code of the currency used in this effect.

            Format is ISO 4217 (a three letter code e.g. ''USD'')

            '
          example: USD
      required:
      - amount
      - currency
    Pricing_RuleLocation:
      type: object
      description: A location that the rule is applicable to
      properties:
        type:
          type: string
          enum:
          - ANYWHERE
          - STATE
          - CITY
          - MARKET
          example: ANYWHERE
          description: "The location type. \n\nFor type ANYWHERE no fields are required.\n\nFor type STATE - \"country\" and \"state\" fields are required.\n\nFor type CITY - \"country\", \"state\" and \"city\" fields are required.\n\nFor type MARKET - \"country\", \"marketCode\" and \"marketName\" fields are required.\n"
        country:
          type: string
          description: Two letter country code in ISO 3166-1 alpha-2 format
          example: US
        state:
          type: string
          description: State
          example: NY
        city:
          type: string
          description: City
          example: Schenectady
        marketCode:
          type: string
          description: Market code
          example: NY_ALB
        marketName:
          type: string
          description: Market name
          example: Albany Market
      required:
      - type
    Pricing_PriorityRuleEffectsInput:
      type: object
      description: 'The effects this rule will have on the price calculation.


        __Only one effect is allowed per rule__

        '
      properties:
        percentageAdjustment:
          $ref: '#/components/schemas/Pricing_PercentageAdjustmentEffect'
        flatAdjustment:
          $ref: '#/components/schemas/Pricing_FlatAdjustmentEffectInput'
        setSellCost:
          $ref: '#/components/schemas/Pricing_SetSellCostEffectInput'
    Pricing_PricingRuleGroup:
      type: string
      description: Pricing rule group filter. If not specified, all rules are returned.
      enum:
      - SPOT
      - CONTRACT
    Pricing_PricingMarketplaceMyBrokerPartnersResponseBroker:
      type: object
      description: A broker rate descriptor
      properties:
        mc:
          type: string
          description: Freight broker MC number
          example: MC00334234
        targetSellCost:
          type: number
          example: 1250
          description: 'Flat target sell cost that this broker is willing to handle the load for

            '
      required:
      - mc
      - targetSellCost
    Pricing_PricingMarketplaceMyBrokerPartnersRequest:
      type: object
      description: Data needed for calculating sell costs for a given lane
      properties:
        transportType:
          $ref: '#/components/schemas/Pricing_TransportType'
        stops:
          $ref: '#/components/schemas/Pricing_Stops'
        region:
          $ref: '#/components/schemas/Pricing_GeographicalAreaLane'
        customerName:
          type: string
          description: Customer name
          example: Test Customer
        pickupDate:
          type: string
          format: date-time
          description: Pick up date in time zone of origin
          example: '2020-01-13T16:00:00Z'
        deliveryDate:
          type: string
          format: date-time
          description: Delivery date in time zone of the destination
          example: '2020-01-13T16:00:00Z'
        weight:
          type: number
          format: float
          description: Weight of the cargo in lb
          example: 10000
        commodity:
          type: string
          description: Name of the commodity
          example: Apples
        currency:
          $ref: '#/components/schemas/Pricing_Currency'
        pricingTypeGroup:
          $ref: '#/components/schemas/Pricing_PricingRuleGroup'
      required:
      - transportType
      - stops
      - pickupDateTime
    Pricing_PriorityRuleCalculation:
      type: object
      description: "Contains an applicable priority rule \nand if possible a calculated `targetSellCost`\n"
      properties:
        rule:
          $ref: '#/components/schemas/Pricing_PriorityRule'
        targetSellCost:
          type: number
          example: 1250
          description: 'Flat target sell cost calculated by applying the rule

            to the provided flat buy cost

            '
      required:
      - rule
externalDocs:
  description: Triumph Intelligence
  url: https://intelligence.triumph.io
x-tagGroups:
- name: Auth
  tags:
  - Auth
  description: "# Authentication\n\n\nTriumph Intelligence API offers OAuth2 Bearer JWT token based authentication.\n\n\nOAuth2 - an open protocol to allow secure authorization in a simple \nand standard method from web, mobile and desktop applications.\n\n\n# \n\n\n# \n\n\n# Direct link integration with Triumph Intelligence\n\nOne of the simplest ways to integrate Triumph Intelligence in to your app is by using the \ndirect link method.\n\nLink format:\n\n    https://intelligence.triumph.io/rates?originZip={}&destinationZip={}&transportType={}\n\n* originZip - 5 digit USA ZIP code of the origin point\n\n* destinationZip - 5 digit USA ZIP code of the destination point\n\n* transportType - one of supported equipment types VAN, REEFER or FLATBED\n\n* OPTIONAL: pickupDate - pickup date string in ISO format e.g. \"2022-04-06T08:00:00.000+03:00\" when not encoded\n\n* OPTIONAL: originCityState - city and state separated by a space symbol, signifying the origin point. \nCan be used instead of originZip if you do not have a zip code of the location. \n_Should not be used together with originZip._\n\n* OPTIONAL: destinationCityState - city and state separated by a space, signifying the destination point. \nCan be used instead of destinationZip if you do not have a zip code of the location. \n_Should not be used together with destinationZip._\n\n* OPTIONAL: customer - name of the customer company\n\n* OPTIONAL: commodity - description of the transported commodity\n\n* OPTIONAL: weight - weight of the load in lbs\n\n* OPTIONAL: deliveryDate - delivery date string in ISO format e.g. \"2022-04-06T08:00:00.000+03:00\" when not encoded\n\n* OPTIONAL: extraStops - any extra stops between origin and destination. Value is an array of strings with up to 10 elements\nin the format of `{order}_{type}_{country}_{address}` \ntypes are `{numbers 0-9}_{CITY or ZIP}_{US or CA}_{if ZIP then 5+ digits, if CITY then city state string separated by space}`\n\nExamples (don't forget to encode the url):\n\n    https://intelligence.triumph.io/rates?originZip=12345&destinationZip=62345&transportType=VAN\n\n    https://intelligence.triumph.io/rates?originCityState=Wausau%20WI&destinationCityState=Evansville%20IN&transportType=VAN\n\n    https://intelligence.triumph.io/rates?originZip=12345&destinationCityState=Evansville%20IN&transportType=VAN\n\n    https://intelligence.triumph.io/rates?originZip=12345&destinationZip=62345&extraStops=0_ZIP_US_28086&extraStops=1_CITY_US_Portland%20OR&transportType=VAN\n\nExample usage:\n\n    <button\n      onclick=\"location.href='https://intelligence.triumph.io/rates?destinationZip=62345&originZip=12345&transportType=VAN'\"\n      type=\"button\">Quote new lane\n    <button>\n\n\n# \n\n\n# \n\n\n# Services and endpoints\n\nThe most versatile (and involving the most work) way of integration is by using our API directly.\nBelow you can find a list of servises and endpoints available for usage.\n"
