components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PricingStatistics:
      type: object
      description: Statistical pricing percentages based on your historical load data
      properties:
        average:
          type: number
          description: Average pricing percentage
          example: 11
        minimum:
          type: number
          description: Minimum pricing percentage
          example: 10
        maximum:
          type: number
          description: Maximum pricing percentage
          example: 13
      required:
        - average
        - minimum
        - maximum
    PricingStatisticsCalculation:
      type: object
      description: |
        Contains historical pricing statistics 
        and if possible a calculated `targetSellCost`
      properties:
        pricing:
          $ref: "#/components/schemas/PricingStatistics"
        targetSellCost:
          type: number
          example: 1250
          description: |
            Flat target sell cost calculated by applying the rule
            to the provided flat buy cost
      required:
        - pricing
    PricingPriorityRuleRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the rule
          example: Customer`s rule
        priority:
          type: integer
          description: Priority of the rule
          example: 3
        active:
          type: boolean
          description: Status of the rule
          example: false
        conditions:
          $ref: "#/components/schemas/RuleRequestConditions"
        effects:
          $ref: "#/components/schemas/PriorityRuleEffectsInput"
        pricingTypeGroup:
          $ref: "#/components/schemas/PricingRuleGroup"
      required:
        - name
        - priority
        - active
        - conditions
        - effects
    RuleRequestConditions:
      type: object
      description: |
        Conditions in which this rule is applicable.

        When multuple conditions are provided the rule is only applied 
        if all of them are met.
      properties:
        commodity:
          type: array
          description: >
            List of commodities to which the rule is applicable.

            At least one commodity from this list has to match for the rule to apply
          items:
            type: string
          example:
            - Apples
        confidenceLevel:
          $ref: "#/components/schemas/ConfidenceLevelRange"
        customers:
          type: array
          description: >
            List of customers to which the rule is applicable. 

            At least one customer from this list has to match for the rule to apply.
          items:
            type: string
            description: Customer name
          example:
            - LTR and Co
            - CocaCola
            - Walmart
        lanes:
          type: array
          description: |
            List of lanes to which the rule is applicable. 
            At least one lane from this list has to match for the rule to apply.
          items:
            $ref: "#/components/schemas/RuleRequestLane"
        lengthOfHaul:
          $ref: "#/components/schemas/LengthOfHaulRange"
        matchingTime:
          $ref: "#/components/schemas/MatchingTimeRange"
        transitTime:
          $ref: "#/components/schemas/TransitTimeRange"
        transportTypes:
          type: array
          maxItems: 3
          description: >
            List of transport types to which the rule is applicable.

            At least one transport type from this list has to match for the rule to apply
          items:
            $ref: "#/components/schemas/TransportType"
        users:
          type: array
          description: |
            List of users to whom the rule is applicable. 
            At least one user from this list has to match for the rule to apply
          items:
            type: string
        weight:
          $ref: "#/components/schemas/WeightRange"
        stopsCount:
          $ref: "#/components/schemas/StopsCountRange"
        mileageDifference:
          $ref: "#/components/schemas/MileageDifferenceRange"
        volumeFrequency:
          $ref: "#/components/schemas/VolumeFrequency"
        loadingTypes:
          type: array
          maxItems: 4
          description: >
            List of loading types (load/unload methods) to which the rule is
            applicable.

            At least one loading type from this list has to match for the rule to apply.
          items:
            $ref: "#/components/schemas/LoadingType"
        contractLength:
          $ref: "#/components/schemas/ContractLengthRange"
        dateCondition:
          $ref: "#/components/schemas/DateCondition"
    RuleRequestLane:
      type: object
      description: A lane that the rule is applicable to
      properties:
        origins:
          $ref: "#/components/schemas/RuleRequestLocations"
        destinations:
          $ref: "#/components/schemas/RuleRequestLocations"
      required:
        - origins
        - destinations
    RuleRequestLocations:
      type: array
      description: A list of locations that the rule is applicable to
      items:
        $ref: "#/components/schemas/RuleRequestLocation"
      example:
        - type: ANYWHERE
        - type: STATE
          country: US
          state: IL
        - type: CITY
          country: US
          state: IL
          city: Chicago
        - type: MARKET
          country: US
          marketCode: NY_ALB
    RuleRequestLocation:
      type: object
      description: Lane stop
      properties:
        type:
          type: string
          enum:
            - ANYWHERE
            - STATE
            - CITY
            - MARKET
          example: ANYWHERE
          description: |
            The location type. 

            For type ANYWHERE no fields are required.

            For type STATE - "country" and "state" fields are required.

            For type CITY - "country", "state" and "city" fields are required.

            For type MARKET - "country" and "marketCode" fields are required.
        country:
          type: string
          description: Two letter country code in ISO 3166-1 alpha-2 format
          example: US
        state:
          type: string
          description: State
          example: NY
        city:
          type: string
          description: City
          example: Schenectady
        marketCode:
          type: string
          description: Market code
          example: NY_ALB
      required:
        - type
    PriorityRuleCalculation:
      type: object
      description: |
        Contains an applicable priority rule 
        and if possible a calculated `targetSellCost`
      properties:
        rule:
          $ref: "#/components/schemas/PriorityRule"
        targetSellCost:
          type: number
          example: 1250
          description: |
            Flat target sell cost calculated by applying the rule
            to the provided flat buy cost
      required:
        - rule
    PricingCombinationRuleRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the rule
          example: Customer`s rule
        active:
          type: boolean
          description: Status of the rule
          example: false
        conditions:
          $ref: "#/components/schemas/RuleRequestConditions"
        effects:
          $ref: "#/components/schemas/CombinationRuleEffectsInput"
        pricingTypeGroup:
          $ref: "#/components/schemas/PricingRuleGroup"
      required:
        - name
        - active
        - conditions
        - effects
    CombinationRulesCalculation:
      type: object
      description: >
        Contains applicable combination rules and if possible a calculated
        `targetSellCost`
      properties:
        rules:
          type: array
          description: List of applicable combination rules
          items:
            $ref: "#/components/schemas/CombinationRule"
        targetSellCost:
          type: number
          example: 1250
          description: |
            Flat target sell cost calculated by applying combination rules 
            to the provided flat buy cost
      required:
        - rules
    PricingCombinationRulesResponse:
      type: object
      properties:
        rules:
          type: array
          description: List of combination rules
          items:
            $ref: "#/components/schemas/CombinationRule"
      required:
        - rules
    PricingPriorityRulesResponse:
      type: object
      properties:
        rules:
          type: array
          description: List of rules
          items:
            $ref: "#/components/schemas/PriorityRule"
      required:
        - rules
    Stops:
      type: array
      description: A list of stops
      minItems: 2
      maxItems: 12
      items:
        $ref: "#/components/schemas/Stop"
      example:
        - order: 0
          address:
            country: US
            city: Red Bluff
            state: CA
            zip: "96080"
        - order: 1
          address:
            country: US
            city: Redding
            state: CA
            zip: "96002"
    Stop:
      type: object
      description: Contains the stop information e.g. address
      properties:
        order:
          type: integer
          description: Stop order, starting from 0
          example: 0
          minimum: 0
        address:
          $ref: "#/components/schemas/Address"
      required:
        - order
        - address
    Address:
      type: object
      description: >
        Location specified by country, city, state and zip code.

        * Country is required

        * Either city-state pair or zip code is required

        * All four parameters can be passed together


        (in case of city-state pair our platform will determine the zip code

        and in case of a zip code, our platform will determine the city and the state)
      properties:
        country:
          type: string
          description: Two letter country code in ISO 3166-1 alpha-2 format
          example: US
        state:
          type: string
          description: State
          example: NY
        city:
          type: string
          description: City
          example: Schenectady
        zip:
          type: string
          description: Zip
          example: "12345"
      required:
        - country
    PricingResponse:
      type: object
      description: A collection of all the pricing options found
      properties:
        default:
          $ref: "#/components/schemas/DefaultPricingCalculation"
        laneHistorical:
          $ref: "#/components/schemas/PricingStatisticsCalculation"
        customerHistorical:
          $ref: "#/components/schemas/PricingStatisticsCalculation"
        customerOnLaneHistorical:
          $ref: "#/components/schemas/PricingStatisticsCalculation"
        priorityRule:
          $ref: "#/components/schemas/PriorityRuleCalculation"
        combinationRules:
          $ref: "#/components/schemas/CombinationRulesCalculation"
        suggested:
          $ref: "#/components/schemas/SuggestedPricing"
        currency:
          type: string
          description: >
            Code of the currency of any monetary values in the response. 


            **Except flat pricing effect descriptors**, those have their own currencies. 


            Format is ISO 4217 (a three letter code e.g. 'USD')
          example: USD
      required:
        - currency
    PricingRequest:
      type: object
      description: A set of fields used during pricing calculation
      properties:
        transportType:
          $ref: "#/components/schemas/TransportType"
        stops:
          $ref: "#/components/schemas/Stops"
        region:
          $ref: "#/components/schemas/GeographicalAreaLane"
        customerName:
          type: string
          description: Customer name
          example: Test Customer
        pickupDate:
          type: string
          format: date-time
          description: Pick up date in time zone of origin
          example: "2020-01-13T16:00:00Z"
        deliveryDate:
          type: string
          format: date-time
          description: Delivery date in time zone of the destination
          example: "2020-01-13T16:00:00Z"
        weight:
          type: number
          format: float
          description: Weight of the cargo in lb
          example: 10000
        commodity:
          type: string
          description: Name of the commodity
          example: Apples
        targetBuyCost:
          type: number
          description: >
            The flat buy cost that the calculated pricing effect will be applied
            to, 

            in order to calculate the flat target sell cost
          example: 1000
        confidenceLevel:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Buy rate prediction confidence level 
            from the rate prediction endpoint response
          example: 65
        currency:
          $ref: "#/components/schemas/Currency"
        pricingTypeGroup:
          $ref: "#/components/schemas/PricingRuleGroup"
        loadingType:
          $ref: "#/components/schemas/LoadingType"
        volume:
          type: number
          format: float
          minimum: 0
          description: Number of shipments for volume-based contract rule matching
          example: 200.5
        volumeFrequency:
          type: string
          description: Frequency period for the volume value
          enum:
            - DAILY
            - WEEKLY
            - MONTHLY
            - ANNUALLY
          example: MONTHLY
        contractLengthDays:
          type: integer
          minimum: 0
          description: Contract duration in days for contract length rule matching
          example: 90
    PricingMarketplaceMyBrokerPartnersRequest:
      type: object
      description: Data needed for calculating sell costs for a given lane
      properties:
        transportType:
          $ref: "#/components/schemas/TransportType"
        stops:
          $ref: "#/components/schemas/Stops"
        region:
          $ref: "#/components/schemas/GeographicalAreaLane"
        customerName:
          type: string
          description: Customer name
          example: Test Customer
        pickupDate:
          type: string
          format: date-time
          description: Pick up date in time zone of origin
          example: "2020-01-13T16:00:00Z"
        deliveryDate:
          type: string
          format: date-time
          description: Delivery date in time zone of the destination
          example: "2020-01-13T16:00:00Z"
        weight:
          type: number
          format: float
          description: Weight of the cargo in lb
          example: 10000
        commodity:
          type: string
          description: Name of the commodity
          example: Apples
        currency:
          $ref: "#/components/schemas/Currency"
        pricingTypeGroup:
          $ref: "#/components/schemas/PricingRuleGroup"
      required:
        - transportType
        - stops
        - pickupDateTime
    PricingMarketplaceMyBrokerPartnersResponse:
      type: object
      description: A response with a list of brokers and their sell rates
      properties:
        brokers:
          type: array
          description: |
            Array of brokers that signified that they want to work with you
            (participate in your marketplace)
          items:
            $ref: "#/components/schemas/PricingMarketplaceMyBrokerPartnersResponseBroker"
        currency:
          type: string
          description: |
            Code of the currency of any monetary values in the response. 

            Format is ISO 4217 (a three letter code e.g. 'USD')
          example: USD
      required:
        - brokers
        - currency
    PricingMarketplaceMyBrokerPartnersResponseBroker:
      type: object
      description: A broker rate descriptor
      properties:
        mc:
          type: string
          description: Freight broker MC number
          example: MC00334234
        targetSellCost:
          type: number
          example: 1250
          description: >
            Flat target sell cost that this broker is willing to handle the load
            for
      required:
        - mc
        - targetSellCost
    DefaultPricingCalculation:
      type: object
      description: |
        Contains the default pricing effects 
        and if possible a calculated `targetSellCost`
      properties:
        effects:
          $ref: "#/components/schemas/DefaultPricingEffects"
        targetSellCost:
          type: number
          example: 1250
          description: >
            Flat target sell cost calculated by applying the default pricing
            effects

            to the provided flat buy cost
      required:
        - effects
    SuggestedPricing:
      type: object
      description: >
        The pricing that we suggest to be used on this lane.


        This is based off of all the other pricing options found and 

        calculated using a priority algorithm. You can either trust us and use this

        to do your quote pricing, or you can choose from any of the other fields

        available in the response
      properties:
        name:
          type: string
          enum:
            - default
            - laneHistorical
            - customerHistorical
            - customerOnLaneHistorical
            - priorityRule
            - combinationRules
          description: |
            The name of the pricing option suggested to be used.

            The values are the names of the other fields of the response.
          example: priorityRule
        targetSellCost:
          type: number
          example: 1250
          description: >
            Flat target sell cost calculated by applying the suggested pricing
            effect

            to the provided flat buy cost
        thresholdViolation:
          type: string
          enum:
            - MIN_RATE
            - MAX_RATE
          description: |
            Set to the rule type of the active threshold rule that the
            computed `targetSellCost` violates (`MIN_RATE` when the rate is
            below the configured minimum, `MAX_RATE` when it exceeds the
            configured maximum). If multiple thresholds are violated only the
            strictest side is reported. Threshold rules never modify the
            suggested price.
          example: MIN_RATE
        thresholdRate:
          type: number
          description: |
            The threshold rate of the matching threshold rule that triggered
            `thresholdViolation`. Returned in the same currency the threshold
            rule was created in.
          example: 1500
      required:
        - name
    CombinationRuleEffectsInput:
      type: object
      description: |
        The effects this rule will have on the price calculation.

        __Only one effect is allowed per rule__
      properties:
        percentageAdjustment:
          $ref: "#/components/schemas/PercentageAdjustmentEffect"
        flatAdjustment:
          $ref: "#/components/schemas/FlatAdjustmentEffectInput"
    FlatAdjustmentEffectInput:
      type: object
      description: |
        In the default interpretation this effect increases the buy cost
        by a flat `amount` of the specified `currency` to get the sell cost
      properties:
        amount:
          type: number
          description: |
            The flat monetary amount by which the buy cost should be increased
          example: 15
        currency:
          $ref: "#/components/schemas/Currency"
      required:
        - amount
    RatePerMileAdjustmentEffectInput:
      type: object
      description: |
        In the default interpretation this effect increases the buy rate
        by an `amount` of the specified `currency` to get the sell cost
      properties:
        amount:
          type: number
          description: |
            The monetary amount by which the buy rate should be increased
          example: 0.15
        currency:
          $ref: "#/components/schemas/Currency"
      required:
        - amount
    SetSellCostEffectInput:
      type: object
      description: |
        In the default interpretation this effect 
        sets the specified `amount` of the specified `currency` 
        as the final sell cost
      properties:
        amount:
          type: number
          description: |
            The flat monetary amount to set as the sell cost
          example: 15
        currency:
          $ref: "#/components/schemas/Currency"
      required:
        - amount
    SetRatePerMileEffectInput:
      type: object
      description: |
        In the default interpretation this effect 
        sets the specified `amount` of the specified `currency` 
        as the final sell rate per mile
      properties:
        amount:
          type: number
          description: |
            The flat monetary amount to set as the sell rate per mile
          example: 3.15
        currency:
          $ref: "#/components/schemas/Currency"
      required:
        - amount
    PriorityRuleEffectsInput:
      type: object
      description: |
        The effects this rule will have on the price calculation.

        __Only one effect is allowed per rule__
      properties:
        percentageAdjustment:
          $ref: "#/components/schemas/PercentageAdjustmentEffect"
        flatAdjustment:
          $ref: "#/components/schemas/FlatAdjustmentEffectInput"
        setSellCost:
          $ref: "#/components/schemas/SetSellCostEffectInput"
    Currency:
      type: string
      enum:
        - USD
        - CAD
      description: |
        Currency code in ISO 4217 format (three letter code, e.g. USD)

        _If not provided, defaults to the currency set in the profile 
        of currently authenticated user (or currently authenticated company 
        if there is no user or user profile setting)_
      example: USD
    Error:
      type: object
      description: A common api error object
      properties:
        code:
          type: string
          description: unique string identifier of the error
        message:
          type: string
          description: human readable error message
      required:
        - code
        - message
      example:
        code: invalid_request
        message: Your ClientId is invalid
    Error422UnprocessableEntityMulti:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        errors:
          type: array
          description: list of errors
          items:
            $ref: "#/components/schemas/RequestValidationError"
      required:
        - code
        - message
        - errors
      example:
        code: request_validation
        message: You have one or more errors in request structure
        errors:
          - field: carrierName
            message: field contains wrong data type (int), should be string
            value: "22"
          - field: shipperId
            message: "shipperId: must not be null"
            value: null
          - field: loadSource.loadId
            message: "loadId: must not be null"
            value: null
    RequestValidationError:
      type: object
      description: Request validation error
      properties:
        field:
          type: string
          description: Name of the field that did not pass validation
          example: transportType
        message:
          type: string
          description: Human readable error mesage explaining why validation failed
          example: SpaceXDragon transportType is not supported. Valid values are [VAN,
            FLATBED, ...]
        value:
          type: string
          nullable: true
          description: Value of the field that did not pass validation
          example: SpaceXDragon
      required:
        - field
        - message
    PricingTypeGroup:
      type: string
      description: |
        How this shipment was priced to the shipper in the following groupings
        (CONTRACT, SPOT, or OTHER)
      enum:
        - CONTRACT
        - SPOT
        - OTHER
      example: SPOT
    PricingRuleGroup:
      type: string
      description: Pricing rule group filter. If not specified, all rules are returned.
      enum:
        - SPOT
        - CONTRACT
    TransportType:
      type: string
      enum:
        - VAN
        - REEFER
        - FLATBED
        - HOTSHOT
      description: >
        Transport type


        If you would like Hotshot predictions, reach out to your CSM and DA. 

        The model will not work properly without your hotshot data effectively filtered and imported into the model.
      example: VAN
    GeographicalAreaLane:
      type: string
      enum:
        - CITY
        - CITY_ZIP
        - ZIP_CITY
        - ZIP
      description: >
        Determines the size of the area around origin and destination points, 

        that will be searched for the related data.

        * CITY - narrow, city wide, area

        * ZIP - narrow, five digit zip, area

        * CITY_ZIP - a special option that sets origin area to CITY and destination area to ZIP

        * ZIP_CITY - a special option that sets origin area to ZIP and destination area to CITY
      example: ZIP
    PriorityRuleEffects:
      type: object
      description: The effects this rule will have on the price calculation
      properties:
        percentageAdjustment:
          $ref: "#/components/schemas/PercentageAdjustmentEffect"
        flatAdjustment:
          $ref: "#/components/schemas/FlatAdjustmentEffect"
        setSellCost:
          $ref: "#/components/schemas/SetSellCostEffect"
    CombinationRuleEffects:
      type: object
      description: The effects this rule will have on the price calculation
      properties:
        percentageAdjustment:
          $ref: "#/components/schemas/PercentageAdjustmentEffect"
        flatAdjustment:
          $ref: "#/components/schemas/FlatAdjustmentEffect"
    DefaultPricingEffects:
      type: object
      description: >
        The default pricing effects that are to be used for the sell cost
        calculation

        if no other pricing options are found
      properties:
        percentageAdjustment:
          $ref: "#/components/schemas/PercentageAdjustmentEffect"
        flatAdjustment:
          $ref: "#/components/schemas/FlatAdjustmentEffect"
        setSellCost:
          $ref: "#/components/schemas/SetSellCostEffect"
    PercentageAdjustmentEffect:
      type: object
      description: |
        In the default interpretation this effect marks up the buy cost
        by some `percentage` to get the sell cost
      properties:
        percentage:
          type: number
          description: The percentage by which the buy cost should be marked up
          example: 15
      required:
        - percentage
    FlatAdjustmentEffect:
      type: object
      description: |
        In the default interpretation this effect increases the buy cost
        by a flat `amount` of the specified `currency` to get the sell cost
      properties:
        amount:
          type: number
          description: |
            The flat monetary amount by which the buy cost should be increased
          example: 15
        currency:
          type: string
          description: |
            Code of the currency used in this effect.
            Format is ISO 4217 (a three letter code e.g. 'USD')
          example: USD
      required:
        - amount
        - currency
    RatePerMileAdjustmentEffect:
      type: object
      description: |
        In the default interpretation this effect increases the buy rate
        by an `amount` of the specified `currency` to get the sell rate
      properties:
        amount:
          type: number
          description: |
            The monetary amount by which the buy rate should be increased
          example: 0.5
        currency:
          type: string
          description: |
            Code of the currency used in this effect.
            Format is ISO 4217 (a three letter code e.g. 'USD')
          example: USD
      required:
        - amount
        - currency
    SetSellCostEffect:
      type: object
      description: |
        In the default interpretation this effect 
        sets the specified `amount` of the specified `currency` 
        as the final sell cost
      properties:
        amount:
          type: number
          description: |
            The flat monetary amount to set as the sell cost
          example: 15
        currency:
          type: string
          description: |
            Code of the currency used in this effect.
            Format is ISO 4217 (a three letter code e.g. 'USD')
          example: USD
      required:
        - amount
        - currency
    SetRatePerMileEffect:
      type: object
      description: |
        In the default interpretation this effect 
        sets the specified `amount` of the specified `currency` 
        as the final rate per mile
      properties:
        amount:
          type: number
          description: |
            The flat monetary amount to set as the sell rate per mile
          example: 3.5
        currency:
          type: string
          description: |
            Code of the currency used in this effect.
            Format is ISO 4217 (a three letter code e.g. 'USD')
          example: USD
      required:
        - amount
        - currency
    ConfidenceLevelRange:
      type: object
      allOf:
        - $ref: "#/components/schemas/IntegerRange"
      description: >
        Confidence level range to which the rule is applicable.


        At least one of the range boundaries has to be provided.


        If only one range boundary is provided, it means that the range is either 

        `<= 'to'` or `>= 'from'`
      properties:
        from:
          type: integer
          description: Minimum confidence level in miles
          minimum: 0
          maximum: 100
          example: 70
        to:
          type: integer
          description: Maximum confidence level in miles
          minimum: 0
          maximum: 100
          example: 100
    RuleLane:
      type: object
      description: Lane description object
      properties:
        origins:
          $ref: "#/components/schemas/RuleLocations"
        destinations:
          $ref: "#/components/schemas/RuleLocations"
      required:
        - origins
        - destinations
    RuleLocations:
      type: array
      description: A list of locations that the rule is applicable to
      items:
        $ref: "#/components/schemas/RuleLocation"
      example:
        - type: ANYWHERE
        - type: STATE
          country: US
          state: IL
        - type: CITY
          country: US
          state: IL
          city: Chicago
        - type: MARKET
          country: US
          marketCode: NY_ALB
          marketName: Albany Market
    RuleLocation:
      type: object
      description: A location that the rule is applicable to
      properties:
        type:
          type: string
          enum:
            - ANYWHERE
            - STATE
            - CITY
            - MARKET
          example: ANYWHERE
          description: >
            The location type. 


            For type ANYWHERE no fields are required.


            For type STATE - "country" and "state" fields are required.


            For type CITY - "country", "state" and "city" fields are required.


            For type MARKET - "country", "marketCode" and "marketName" fields are required.
        country:
          type: string
          description: Two letter country code in ISO 3166-1 alpha-2 format
          example: US
        state:
          type: string
          description: State
          example: NY
        city:
          type: string
          description: City
          example: Schenectady
        marketCode:
          type: string
          description: Market code
          example: NY_ALB
        marketName:
          type: string
          description: Market name
          example: Albany Market
      required:
        - type
    LengthOfHaulRange:
      type: object
      allOf:
        - $ref: "#/components/schemas/IntegerRange"
      description: >
        Range of the distance of the route to which the rule is applicable.


        At least one of the range boundaries has to be provided.


        If only one range boundary is provided, it means that the range is either 

        `<= 'to'` or `>= 'from'`
      properties:
        from:
          type: integer
          description: Minimum distance in miles
          minimum: 0
          example: 50
        to:
          type: integer
          description: Maximum distance in miles
          minimum: 0
          example: 250
    WeightRange:
      type: object
      allOf:
        - $ref: "#/components/schemas/IntegerRange"
      description: >
        Weight range, of the cargo, to which the rule is applicable.


        At least one of the range boundaries has to be provided.


        If only one range boundary is provided, it means that the range is either 

        `<= 'to'` or `>= 'from'`
      properties:
        from:
          type: integer
          description: Minimum weight in lb
          minimum: 0
          example: 0
        to:
          type: integer
          description: Maximum weight in lb
          minimum: 0
          example: 45000
    MatchingTimeRange:
      type: object
      allOf:
        - $ref: "#/components/schemas/FloatRange"
      description: >
        Matching time range to which the rule is applicable.


        At least one of the range boundaries has to be provided.


        If only one range boundary is provided, it means that the range is either 

        `<= 'to'` or `>= 'from'`
      properties:
        from:
          type: number
          format: float
          description: Minimum matching time in hours
          minimum: 0
          example: 20
        to:
          type: number
          format: float
          description: Maximum matching time in hours
          minimum: 0
          example: 30
    TransitTimeRange:
      type: object
      allOf:
        - $ref: "#/components/schemas/FloatRange"
      description: >
        Transit time range to which the rule is applicable.


        At least one of the range boundaries has to be provided.


        If only one range boundary is provided, it means that the range is either 

        `<= 'to'` or `>= 'from'`
      properties:
        from:
          type: number
          format: float
          description: Minimum transit time in hours
          minimum: 0
          example: 10
        to:
          type: number
          format: float
          description: Maximum transit time in hours
          minimum: 0
          example: 24
    RuleConditions:
      type: object
      description: |
        Conditions in which this rule is applicable.

        When multuple conditions are provided the rule is only applied 
        if all of them are met
      properties:
        commodity:
          type: array
          description: >
            List of commodities to which the rule is applicable.

            At least one commodity from this list has to match for the rule to apply
          items:
            type: string
          example:
            - Apples
        confidenceLevel:
          $ref: "#/components/schemas/ConfidenceLevelRange"
        customers:
          type: array
          description: >
            List of customers to which the rule is applicable. 

            At least one customer from this list has to match for the rule to apply
          items:
            type: string
            description: Customer name
          example:
            - LTR and Co
            - CocaCola
            - Walmart
        lanes:
          type: array
          description: |
            List of lanes to which the rule is applicable. 
            At least one lane from this list has to match for the rule to apply
          items:
            $ref: "#/components/schemas/RuleLane"
        lengthOfHaul:
          $ref: "#/components/schemas/LengthOfHaulRange"
        matchingTime:
          $ref: "#/components/schemas/MatchingTimeRange"
        transitTime:
          $ref: "#/components/schemas/TransitTimeRange"
        transportTypes:
          type: array
          maxItems: 2
          description: >
            List of transport types to which the rule is applicable.

            At least one transport type from this list has to match for the rule to apply
          items:
            $ref: "#/components/schemas/TransportType"
        users:
          type: array
          description: |
            List of users to whom the rule is applicable. 
            At least one user from this list has to match for the rule to apply
          items:
            type: string
        weight:
          $ref: "#/components/schemas/WeightRange"
        stopsCount:
          $ref: "#/components/schemas/StopsCountRange"
        mileageDifference:
          $ref: "#/components/schemas/MileageDifferenceRange"
        volumeFrequency:
          $ref: "#/components/schemas/VolumeFrequency"
        loadingTypes:
          type: array
          maxItems: 4
          description: >
            List of loading types (load/unload methods) to which the rule is
            applicable.

            At least one loading type from this list has to match for the rule to apply.
          items:
            $ref: "#/components/schemas/LoadingType"
        contractLength:
          $ref: "#/components/schemas/ContractLengthRange"
        dateCondition:
          $ref: "#/components/schemas/DateCondition"
    CombinationRule:
      type: object
      description: Combination pricing rule
      properties:
        id:
          type: integer
          format: int64
          description: Id of the rule
          example: 12345
        name:
          type: string
          description: Name of the pricing rule
          example: Customer`s rule
        active:
          type: boolean
          description: Status of the rule
          example: false
        conditions:
          $ref: "#/components/schemas/RuleConditions"
        effects:
          $ref: "#/components/schemas/CombinationRuleEffects"
        pricingTypeGroup:
          $ref: "#/components/schemas/PricingRuleGroup"
      required:
        - id
        - name
        - active
        - conditions
        - effects
    PriorityRule:
      type: object
      description: Priority pricing rule
      properties:
        id:
          type: integer
          format: int64
          description: Id of the rule
          example: 12345
        name:
          type: string
          description: Name of the rule
          example: Customer`s rule
        priority:
          type: integer
          description: Priority of the rule
          example: 3
        active:
          type: boolean
          description: Status of the rule
          example: false
        conditions:
          $ref: "#/components/schemas/RuleConditions"
        effects:
          $ref: "#/components/schemas/PriorityRuleEffects"
        pricingTypeGroup:
          $ref: "#/components/schemas/PricingRuleGroup"
      required:
        - id
        - name
        - priority
        - active
        - conditions
        - effects
    ThresholdRule:
      type: object
      description: |
        Threshold pricing rule. Validates that the computed sell rate
        does not fall outside a configured min or max boundary.
        A violation is surfaced as a high-risk indicator on the affected lane;
        threshold rules do not modify the computed rate.
      properties:
        id:
          type: integer
          format: int64
          description: Id of the rule
          example: 12345
        name:
          type: string
          description: Name of the rule
          example: Customer min rate
        type:
          $ref: "#/components/schemas/PricingRuleType"
        active:
          type: boolean
          description: Status of the rule
          example: false
        threshold:
          type: number
          description: |
            The threshold value. Interpretation depends on `unit`:
            - DOLLARS: an absolute sell-rate value in the rule's currency
              (lane is clamped when the computed sell rate is below MIN_RATE
              or above MAX_RATE).
            - PERCENT: a percentage (0-100) resolved against the buy rate
              using the customer's pricing mode (markup or margin).
          example: 1500
        unit:
          $ref: "#/components/schemas/ThresholdUnit"
        currency:
          type: string
          description: |
            Code of the currency used in this threshold.
            Required when `unit` is DOLLARS; ignored when `unit` is PERCENT.
            Format is ISO 4217 (a three letter code e.g. 'USD')
          example: USD
        conditions:
          $ref: "#/components/schemas/RuleConditions"
        pricingTypeGroup:
          $ref: "#/components/schemas/PricingRuleGroup"
      required:
        - id
        - name
        - type
        - active
        - threshold
        - unit
        - conditions
    PricingThresholdRuleRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the rule
          example: Customer min rate
        type:
          $ref: "#/components/schemas/PricingRuleType"
        active:
          type: boolean
          description: Status of the rule
          example: false
        threshold:
          type: number
          description: |
            The threshold value. Interpretation depends on `unit`:
            - DOLLARS: an absolute sell-rate value in the rule's currency.
            - PERCENT: a percentage (0-100) resolved against the buy rate
              using the customer's pricing mode (markup or margin).
          example: 1500
        unit:
          $ref: "#/components/schemas/ThresholdUnit"
        currency:
          type: string
          description: |
            Code of the currency used in this threshold.
            Required when `unit` is DOLLARS; ignored when `unit` is PERCENT.
            Format is ISO 4217 (a three letter code e.g. 'USD')
          example: USD
        conditions:
          $ref: "#/components/schemas/RuleRequestConditions"
        pricingTypeGroup:
          $ref: "#/components/schemas/PricingRuleGroup"
      required:
        - name
        - type
        - active
        - threshold
        - unit
        - conditions
    PricingThresholdRulesResponse:
      type: object
      properties:
        rules:
          type: array
          description: List of threshold rules
          items:
            $ref: "#/components/schemas/ThresholdRule"
      required:
        - rules
    PricingRuleType:
      type: string
      enum:
        - PRIORITY
        - COMBINATION
        - MIN_RATE
        - MAX_RATE
      description: Pricing rule type
      example: PRIORITY
    ThresholdUnit:
      type: string
      description: >
        Unit in which the threshold value is expressed.

        DOLLARS - the threshold is an absolute sell-rate value in the rule's currency.

        PERCENT - the threshold is a percentage; resolved against the buy rate using

        the customer's pricing mode (markup or margin) at evaluation time.
      enum:
        - DOLLARS
        - PERCENT
      default: DOLLARS
      example: DOLLARS
    PricingRatePerMileAndMileage:
      type: object
      description: |
        Composite object representing rate per miles and mileage
      properties:
        rate:
          type: number
          description: >
            The per mile buy rate that the calculated pricing effect will be
            applied to, 

            in order to calculate the target sell rate
          example: 3.4
        miles:
          type: number
          description: |
            Estimated miles for the trip
          example: 667
      required:
        - rate
        - miles
    PricingRulesSearchRequest:
      type: object
      x-parent: true
      properties:
        filters:
          $ref: "#/components/schemas/PricingRuleFilters"
    PricingPriorityRulesSearchRequest:
      type: object
      allOf:
        - $ref: "#/components/schemas/PricingRulesSearchRequest"
      properties:
        sorting:
          $ref: "#/components/schemas/PricingPriorityRulesSorting"
    PricingCombinationRulesSearchRequest:
      type: object
      allOf:
        - $ref: "#/components/schemas/PricingRulesSearchRequest"
      properties:
        sorting:
          $ref: "#/components/schemas/PricingCombinationRulesSorting"
    PricingCombinationRulesSearchResponse:
      type: object
      description: Combination pricing rules search response
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        items:
          type: array
          description: List of combination rules
          items:
            $ref: "#/components/schemas/CombinationRule"
      required:
        - pagination
        - items
    PricingPriorityRulesSearchResponse:
      type: object
      description: Priority pricing rules search response
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        items:
          type: array
          description: List of rules
          items:
            $ref: "#/components/schemas/PriorityRule"
      required:
        - pagination
        - items
    PricingCheckRuleNameExistsResponse:
      type: object
      properties:
        value:
          type: boolean
          example: false
          description: |
            True if rule name already exists
      required:
        - value
    PricingRuleFilters:
      type: object
      description: Rule filters
      properties:
        creationDateRange:
          type: object
          description: Date range to search for the report data
          properties:
            from:
              type: string
              format: date
              description: |
                Date to start the search from. 
                Format is ISO date. 
                Time zone is considered to be UTC.

                Defaults to a month ago from now.
              example: "2023-06-18"
            to:
              type: string
              format: date
              description: |
                Date to end the search at. 
                Format is ISO date. 
                Time zone is considered to be UTC.

                Defaults to today.
              example: "2023-10-18"
        transportTypeGroups:
          type: array
          description: Transport type groups to look for in the rule conditions
          items:
            type: string
            description: Transport type group
            enum:
              - VAN
              - REEFER
              - FLATBED
              - HOTSHOT
              - OTHER
            example: VAN
        origins:
          type: array
          description: >
            Origin locations.


            The most granular provided value is used for filtering. 

            e.g if the most granular value is:

            * zip - data will be filtered by zip code

            * city - data will be filtered by city (in this case state is required)

            * state - data will be filtered by state
          items:
            $ref: "#/components/schemas/LocationFilter"
        destinations:
          type: array
          description: >
            Destination locations.


            The most granular provided value is used for filtering. 

            e.g if the most granular value is:

            * zip - data will be filtered by zip code

            * city - data will be filtered by city (in this case state is required)

            * state - data will be filtered by state
          items:
            $ref: "#/components/schemas/LocationFilter"
        shippers:
          type: array
          description: Shipper company names to look for in the rule conditions
          items:
            type: string
            description: Shipper company name
            example: Walmart
        commodities:
          type: array
          description: list of commodities to look for in the rule conditions
          items:
            type: string
            description: Commodity description in free form
            example: Steel racks
        users:
          type: array
          description: Users to look for in the rule conditions
          items:
            type: string
            description: User
            example: user@greenscreens.ai
        distanceRanges:
          type: array
          description: Distance ranges to look for in the rule conditions
          items:
            $ref: "#/components/schemas/DistanceRange"
        confidenceLevelRanges:
          type: array
          description: Confidence level ranges to look for in the rule conditions
          items:
            $ref: "#/components/schemas/ConfidenceRangeFilter"
        ruleName:
          type: string
          description: Name part of pricing rule
          example: Extra long rule name 2
        transitTimeRanges:
          type: array
          description: Transit time ranges to look for in the rule conditions
          items:
            $ref: "#/components/schemas/TransitTimeRangeFilter"
        matchingTimeRanges:
          type: array
          description: Matching time ranges to look for in the rule conditions
          items:
            $ref: "#/components/schemas/MatchingTimeRangeFilter"
        weightRanges:
          type: array
          description: Weight ranges to look for in the rule conditions
          items:
            $ref: "#/components/schemas/WeightRangeFilter"
        active:
          type: boolean
          description: Status of the rule
          example: false
        pricingTypeGroup:
          $ref: "#/components/schemas/PricingRuleGroup"
    PricingPriorityRulesSorting:
      type: object
      allOf:
        - $ref: "#/components/schemas/PricingRulesSorting"
      description: |
        Sorting settings for the rule analytics table response
      properties:
        sortBy:
          type: string
          enum:
            - CREATION_DATE
            - RULE_NAME
            - STATUS
            - PRIORITY
          description: |
            The field that the response data should be sorted by
          default: STATUS
          example: CREATION_DATE
    PricingCombinationRulesSorting:
      type: object
      allOf:
        - $ref: "#/components/schemas/PricingRulesSorting"
      description: |
        Sorting settings for the rule analytics table response
      properties:
        sortBy:
          type: string
          enum:
            - CREATION_DATE
            - RULE_NAME
            - STATUS
          description: |
            The field that the response data should be sorted by
          default: STATUS
          example: CREATION_DATE
    PricingRulesSorting:
      type: object
      x-parent: true
      description: |
        Sorting settings for the rule analytics table response
      properties:
        sortOrder:
          type: string
          enum:
            - ASCENDING
            - DESCENDING
          description: |
            Order in which the response data should be sorted
          default: DESCENDING
          example: ASCENDING
    PricingRuleFilterValuesResponse:
      type: object
      properties:
        shippers:
          type: array
          description: |
            Shipper names present in the pricing rules
          items:
            type: string
            description: Shipper name
            example: Walmart
        users:
          type: array
          description: |
            User names present in the pricing rules
          items:
            type: string
            description: User name or code or email, etc.
            example: leroy.jenkins@greenscreens.ai
      required:
        - shippers
        - users
    LocationFilter:
      type: object
      description: |
        Location descriptor used for filtering reports.

        The most granular provided value is used for filtering. 
        e.g if the most granular value is:
        * city - data will be filtered by city (in this case state is required)
        * state - data will be filtered by state
        * marketCode - data will be filtered by market code
      properties:
        country:
          type: string
          description: Two letter country code in ISO 3166-1 alpha-2 format
          example: US
        marketCode:
          type: string
          description: Market code
          example: NY_ALB
        state:
          type: string
          description: State
          example: NY
        city:
          type: string
          description: City
          example: Schenectady
      required:
        - country
    DistanceRange:
      type: object
      description: Distance range (inclusive)
      properties:
        from:
          type: integer
          description: Start distance (inclusive)
          minimum: 0
          example: 1000
        to:
          type: integer
          description: End distance (inclusive)
          minimum: 0
          example: 1500
    ConfidenceRangeFilter:
      type: object
      description: Confidence range to search for the report data
      properties:
        from:
          type: integer
          description: Confidence level to start the search from
          minimum: 0
          example: 76
          default: 0
        to:
          type: integer
          description: Confidence level to end the search at
          minimum: 0
          example: 87
          default: 100
    TransitTimeRangeFilter:
      type: object
      description: |
        Transit time range filter
      properties:
        from:
          type: number
          format: float
          description: Minimum transit time in hours
          minimum: 0
          example: 10
        to:
          type: number
          format: float
          description: Maximum transit time in hours
          minimum: 0
          example: 24
    WeightRangeFilter:
      type: object
      description: |
        Weight range filter
      properties:
        from:
          type: integer
          description: Minimum weight in lb
          minimum: 0
          example: 0
        to:
          type: integer
          description: Maximum weight in lb
          minimum: 0
          example: 45000
    MatchingTimeRangeFilter:
      type: object
      description: |
        Matching time range filter
      properties:
        from:
          type: number
          format: float
          description: Minimum matching time in hours
          minimum: 0
          example: 20
        to:
          type: number
          format: float
          description: Maximum matching time in hours
          minimum: 0
          example: 30
    Pagination:
      type: object
      description: Response pagination data
      properties:
        pageNumber:
          type: integer
          description: Current page number (zero-based)
          minimum: 0
          example: 0
        pageSize:
          type: integer
          description: Number of items per page
          minimum: 1
          example: 50
        totalElements:
          type: integer
          format: int64
          description: Total number of items available
          example: 150
        totalPages:
          type: integer
          description: Total number of pages
          example: 3
      required:
        - pageNumber
        - pageSize
    IntegerRange:
      type: object
      x-parent: true
      properties:
        from:
          type: integer
          minimum: 0
          example: 50
        to:
          type: integer
          minimum: 0
          example: 250
    FloatRange:
      type: object
      x-parent: true
      properties:
        from:
          type: number
          format: float
          minimum: 0
          example: 20
        to:
          type: number
          format: float
          minimum: 0
          example: 30
    StopsCountRange:
      type: object
      description: >
        Range of the stops count of the route to which the rule is applicable.


        Stops count includes origin and destination i.e. route with one extra stop will have 3 stops in total.


        At least one of the range boundaries has to be provided.


        If only one range boundary is provided, it means that the range is either 

        `<= 'to'` or `>= 'from'`
      allOf:
        - $ref: "#/components/schemas/IntegerRange"
      properties:
        from:
          type: integer
          minimum: 0
          description: Minimum stops count
          example: 3
        to:
          type: integer
          minimum: 0
          description: Maximum stops count
          example: 10
    MileageDifferenceRange:
      type: object
      allOf:
        - $ref: "#/components/schemas/IntegerRange"
      description: >
        Range of the stops count of the route to which the rule is applicable.


        At least one of the range boundaries has to be provided.


        If only one range boundary is provided, it means that the range is either

        `<= 'to'` or `>= 'from'`
      properties:
        from:
          type: integer
          description: Minimum difference in miles
          minimum: 0
          example: 50
        to:
          type: integer
          description: Maximum difference in miles
          minimum: 0
          example: 250
    VolumeFrequency:
      type: object
      description: >
        Volume and frequency condition for the rule.

        Matches rules to lanes based on shipment volume within a given frequency period.
      required:
        - volume
        - frequency
      properties:
        volume:
          type: number
          format: float
          minimum: 0
          description: Minimum number of shipments
          example: 150.5
        frequency:
          type: string
          description: Time period for volume measurement
          enum:
            - DAILY
            - WEEKLY
            - MONTHLY
            - ANNUALLY
          example: MONTHLY
    LoadingType:
      type: string
      description: Loading/unloading method for a shipment.
      enum:
        - LIVE_LIVE
        - LIVE_DROP
        - DROP_LIVE
        - DROP_DROP
      example: LIVE_LIVE
    ContractLengthRange:
      type: object
      description: >
        Range of the contract duration to which the rule is applicable.


        At least one of the range boundaries has to be provided.


        If only one range boundary is provided, it means that the range is either

        `<= 'to'` or `>= 'from'`
      properties:
        from:
          type: object
          description: A single boundary of the contract length range with a value and unit.
          required:
            - value
            - unit
          properties:
            value:
              type: integer
              minimum: 0
              description: Duration value
              example: 60
            unit:
              type: string
              description: Unit of time for the duration value
              enum:
                - DAYS
                - MONTHS
              example: DAYS
            inclusive:
              type: boolean
              description: Whether this boundary is inclusive
              default: true
        to:
          type: object
          description: A single boundary of the contract length range with a value and unit.
          required:
            - value
            - unit
          properties:
            value:
              type: integer
              minimum: 0
              description: Duration value
              example: 60
            unit:
              type: string
              description: Unit of time for the duration value
              enum:
                - DAYS
                - MONTHS
              example: DAYS
            inclusive:
              type: boolean
              description: Whether this boundary is inclusive
              default: true
    DateCondition:
      type: object
      description: |
        Date-based condition for the rule.
        Supports three modes: days of week, days of month, or a date range.
        Exactly one mode must be specified.
      required:
        - mode
      properties:
        mode:
          type: string
          description: The type of date condition
          enum:
            - DAYS_OF_WEEK
            - DAYS_OF_MONTH
            - DATE_RANGE
          example: DAYS_OF_WEEK
        daysOfWeek:
          type: array
          description: |
            Days of the week when the rule applies.
            Required when mode is DAYS_OF_WEEK.
          items:
            type: string
            enum:
              - MONDAY
              - TUESDAY
              - WEDNESDAY
              - THURSDAY
              - FRIDAY
              - SATURDAY
              - SUNDAY
          example:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
        daysOfMonth:
          type: array
          description: |
            Days of the month when the rule applies (1-31).
            Required when mode is DAYS_OF_MONTH.
          items:
            type: integer
            minimum: 1
            maximum: 31
          example:
            - 1
            - 15
            - 28
        dateFrom:
          type: string
          format: date
          description: |
            Start date of the range (inclusive).
            Required when mode is DATE_RANGE.
          example: "2026-01-01"
        dateTo:
          type: string
          format: date
          description: |
            End date of the range (inclusive).
            Required when mode is DATE_RANGE.
          example: "2026-12-31"
externalDocs:
  description: Triumph Intelligence
