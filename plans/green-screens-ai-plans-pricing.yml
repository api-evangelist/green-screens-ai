description: >-
  Green Screens AI (Triumph Intelligence) publishes NO plans, tiers, quotas, or prices. It is an
  enterprise, contract-negotiated freight-intelligence product sold to brokers through a sales
  conversation; the API is an entitlement of that contract rather than a separately purchasable
  product. There is no public pricing page, no self-serve signup, and no free tier.
